"sec":"15 Data Transmission and Backend Communication"},"FR-COM-014":{"m":"5","t":"Where the user has refused permission for device notifications, the software shall support an SMS message as an alternative means of alerting them that a timed stage requires their attention.","src":"SPEC-05 review; waiting-time UX study","note":"Added at the SPEC-05 review as future development. The study proposes it as the fallback where the notification route is closed, and a wait of minutes is exactly where losing the user costs a kit. It does not weaken FR-COM-012, which tolerates refusal and leaves the on-screen countdown carrying the obligation; it adds a route rather than a condition. A backend capability, adjacent to FR-COM-013","sec":"15 Data Transmission and Backend Communication"},"FR-ALG-001":{"m":"3","t":"The backend shall determine albumin concentration, creatinine concentration and the albumin-to-creatinine ratio from the validated image data, using an algorithm version approved for the applicable system configuration.","src":"RA 4.21, 4.22","note":"Algo","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-002":{"m":"3","t":"The system shall maintain a controlled mapping between supported software configurations and approved algorithm versions, and shall analyse an exam only using an algorithm version approved for the applicable configuration.","src":"RA 4.22","note":"Backend","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-003":{"m":"TBD","t":"The backend shall validate that the mobile algorithm version and the backend algorithm version assigned to an exam are an approved combination, and shall prevent analysis where either version is missing or unsupported, or where the combination is not approved.","src":"RA 4.22","note":"Backend. TBD, and may become obsolete when the Risk Analysis is next revised","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-004":{"m":"2","t":"The system shall record, for each exam, the mobile and backend algorithm versions, the application version and the backend version used to produce the result, together with a timestamp, the device identifier, the patient identifier, the reported values, the raw results, error records and diagnostic metadata.","src":"RA 4.22; SRS-BE LOG.1, LOG.2","note":"Backend. Record contents stated from the backend SRS","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-005":{"m":"3","t":"The system shall perform standard-curve quality control on each test and shall block the reporting of a result where quality control fails.","src":"RA 3.6, 3.7, 7.33, 7.35","note":"Algo","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-006":{"m":"3","t":"The system shall evaluate the recovery and blank wells within the Detection Wells in order to detect foreign or interfering substances and discoloration of the diluted urine, and shall block the reporting of a result where the acceptance criteria are not met.","src":"RA 1.6, 7.20; Glossary","note":"Algo","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-007":{"m":"2","t":"The system shall detect an incomplete assay run, including the condition in which both albumin and creatinine are below the limit of detection, shall invalidate the test, and shall cause the application to prompt the user to repeat the test with a new kit.","src":"RA 1.1, 1.3, 1.7, 2.1, 2.4, 2.5, 2.6, 2.9, 3.1, 3.2, 3.3, 7.6, 7.7, 7.8, 7.22, 7.29, 7.34","note":"Algo; surfaced in app","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-008":{"m":"TBD","t":"The system shall detect that the urine sample was not introduced into the buffer, and shall detect that insufficient fluid reached the Detection Wells, and shall block the reporting of a result where either condition is present.","src":"RA 3.8, 7.9, 7.30, 7.36","note":"Algo. TBD, to be settled when the Risk Analysis is next revised. Out-of-sequence assay signatures cannot be detected; RA 3.8 and RA 7.36 currently have no other software control","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-009":{"m":"2","t":"The system shall detect insufficient colour output in the standard curves and shall block the reporting of a result where the acceptance criteria are not met.","src":"RA 3.5, 3.6, 3.7","note":"Algo; albumin standards AS1–AS4, creatinine standards CS1–CS4","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-010":{"m":"2","t":"The result payload returned to the application shall distinguish unambiguously between a valid quantitative result and an invalid test, and the application shall not present a numeric value for an invalid test under any condition.","src":"RA 4.21; derived","note":"","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-011":{"m":"3","t":"The system shall identify results that fall outside the claimed measuring range and shall convey that condition to the application for presentation.","src":"RA 4.21","note":"Algo; presentation per FR-RES-004","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-ALG-012":{"m":"2","t":"The result payload shall include a reason category for each invalid test, drawn from a defined enumeration, sufficient for the application to inform the user of the corrective action required.","src":"RA 4.3, 4.4","note":"Dependency of FR-TXT-021","sec":"16 Analysis, Quality Control and Algorithm Version Management"},"FR-RES-001":{"m":"1","t":"After receiving results from the backend, the software shall display them to the user. The backend shall transmit the result for the exam identified in the request.","src":"SRS TSM.28; SRS-BE COM.7, COM.11","note":"","sec":"17 Result Presentation"},"FR-RES-002":{"m":"1","t":"The software shall present the albumin-to-creatinine ratio both as a numerical value and as a result category.","src":"RA 7.17","note":"Presentation is fixed: the ratio only, as a value and a category. Unlinked from resultsType and staticData.showAcrResultOnly at review. Presentation of the albumin and creatinine values is future development; see FR-RES-007","sec":"17 Result Presentation"},"FR-RES-003":{"m":"1","t":"The software shall present the units of measurement applicable to each reported value.","src":"Derived; supports RA 7.17","note":"Not required by RA 7.17; retained as a product decision","sec":"17 Result Presentation"},"FR-RES-004":{"m":"2","t":"Where the result falls outside the claimed measuring range, the software shall present that condition rather than an unqualified numeric value.","src":"RA 4.21","note":"","sec":"17 Result Presentation"},"FR-RES-005":{"m":"1","t":"For an invalid test, the software shall present an invalid-test outcome rather than any numeric value.","src":"RA 4.3, 4.4; FR-ALG-010","note":"Messaging per FR-TXT-021","sec":"17 Result Presentation"},"FR-RES-006":{"m":"1","t":"Where the application is in demonstration mode for the test being performed, the software shall present a result drawn from a fixed demonstration payload rather than from an analysed test, shall not present that result as a clinical result, and shall make the demonstration state evident wherever that result is presented.","src":"Review decision CR-07, CR-08","note":"Added at review so that milestone 1 can present a result before any of the analysis pipeline exists. Demonstration mode is a state the backend returns with the configuration before a test starts, not a separate build, so the same artefact that ships to patients can be placed in it — which is why the evidence of the state must be visible to the user and why FR-CFG-004, server-side enforcement of demonstration behaviour, matters more than its deferral suggests. In demonstration mode no algorithm version is exercised, which is why quantitation and the approved-version mapping are not needed at milestone 1","sec":"17 Result Presentation"},"FR-RES-007":{"m":"5","t":"The software shall present the albumin and creatinine values in addition to the albumin-to-creatinine ratio.","src":"Review item R-03; formerly BL-12","note":"Future development, formerly BL-12. Constrained by staticData.showAcrResultOnly, currently true. See FR-RES-002.","sec":"17 Result Presentation"},"FR-ACC-001":{"m":"4","t":"The software shall restrict access to the post-test results center to users who have set a PIN code.","src":"SRS TSM.30; SPTA 1.4, 1.7","note":"","sec":"18 Results Access Protection"},"FR-ACC-002":{"m":"4","t":"If a PIN code has not been set, the software shall prompt the user to create one before granting access to the results center. The backend shall report whether a PIN is registered for the user profile.","src":"SRS TSM.31; SRS-BE PIN.1; SPTA 1.4","note":"","sec":"18 Results Access Protection"},"FR-ACC-004":{"m":"4","t":"The software shall restrict PIN code entry to numeric values only, of four digits.","src":"SRS TSM.32; SPTA 2.1","note":"Length is four digits and the attempt limit is five, both settled at review. Enforced server-side per the backend SRS","sec":"18 Results Access Protection"},"FR-ACC-005":{"m":"4","t":"If the maximum number of incorrect PIN attempts is reached, the software shall deny access to the results center and instruct the user to contact support. The backend shall maintain the failure counter and enforce the limit.","src":"SRS TSM.33; SRS-BE PIN.2, PIN.4, PIN.5","note":"Limit is five consecutive failed attempts per the backend SRS, enforced server-side","sec":"18 Results Access Protection"},"FR-ACC-006":{"m":"4","t":"If the user has not set a PIN code within the defined period after test completion, the software shall lock PIN setup and direct the user to contact support, who may reset it following identity re-verification. The backend shall reject any PIN setup request received after that period.","src":"SRS TSM.34; SRS-BE PIN.6; SPTA 1.7","note":"Period is 24 hours, confirmed by both the threat analysis and the backend SRS, and enforced server-side. The support reset path is deferred as FR-ACC-008","sec":"18 Results Access Protection"},"FR-ACC-009":{"m":"4","t":"After 15 minutes of inactivity in the results center, the software shall return the user to the home screen and shall require the PIN to be entered again before the results center can be re-entered. The backend shall invalidate the session on the same interval.","src":"SPTA 1.7; SRS-BE PIN.7","note":"The 15-minute value comes from the threat analysis and is confirmed by the backend SRS, which enforces it server-side. Applies to the results center only; FR-STA-003 bars any inactivity timeout during an active test. Restated at review: re-entry is by PIN rather than Date of Birth, since the Date of Birth is no longer requested at login","sec":"18 Results Access Protection"},"FR-ACC-003":{"m":"5","t":"The software shall integrate PIN setup into the test workflow, so that the user is prompted to set a PIN as part of completing the test.","src":"RA 7.21; formerly BL-25, restored to its original identifier","note":"Future development, formerly BL-25. With FR-ACC-007 and FR-ACC-008 also deferred, RA 7.21 has no software control in this version; severity is 1 and the consequence is loss of access to results beyond the initial view.","sec":"18 Results Access Protection"},"FR-ACC-007":{"m":"5","t":"After successful PIN setup, the software shall offer the user the option to enable biometric authentication for results-center access on devices that provide it.","src":"SRS TSM.35; RA 7.21; formerly BL-26, restored to its original identifier","note":"Future development, formerly BL-26. With FR-ACC-003 and FR-ACC-008; see the note against FR-ACC-003.","sec":"18 Results Access Protection"},"FR-ACC-008":{"m":"5","t":"The software shall support PIN reset by customer support following identity re-verification.","src":"RA 7.21; formerly BL-27, restored to its original identifier","note":"Future development, formerly BL-27. With FR-ACC-003 and FR-ACC-007; a user who forgets their PIN has no recovery path until this is implemented.","sec":"18 Results Access Protection"},"FR-PRT-001":{"m":"3","t":"The software shall provide a results center as a screen of its own, giving the authenticated user ongoing access to their most recent result and stating the date on which that test was performed. The backend shall transmit that result on request.","src":"Product requirement; SRS-BE COM.12","note":"Split at review: the results center main screen shows the most recent result and is milestone 3; the history of earlier results is a separate screen and is deferred as FR-PRT-015. Whether invalidated tests appear, and whether results belonging to another registered user on the same phone number are excluded, are to be specified; the second bears on RA 6.4","sec":"19 Results Center and the Main Menu"},"FR-PRT-007":{"m":"3","t":"The software shall present a control on the home screen by which an authenticated user can open the results center directly, separately from the main menu.","src":"Product requirement","note":"Added at review. A second entry point to the results center alongside the main menu of FR-PRT-002, so that a returning user reaches their result without going through a menu","sec":"19 Results Center and the Main Menu"},"FR-PRT-002":{"m":"3","t":"The software shall present a main menu, reached from a hamburger control on the home screen, available to an authenticated user at any time outside an active test.","src":"Product requirement","note":"The container for FR-PRT-003 to FR-PRT-005, and for the deferred FAQ entry FR-SUP-001. Priority follows the menu items required at milestone 3","sec":"19 Results Center and the Main Menu"},"FR-PRT-003":{"m":"3","t":"The main menu shall give access to an About screen presenting the regulatory information required for the device.","src":"Product requirement","note":"Content to be specified by regulatory. Subject to FR-TXT-002 for component naming; whether the grade-6 reading level in FR-TXT-001 applies to mandated regulatory wording is to be confirmed","sec":"19 Results Center and the Main Menu"},"FR-PRT-004":{"m":"3","t":"The main menu shall give access to support contact, enabling an authenticated user to reach support without starting a test.","src":"Product requirement; SRS STM.10","note":"Adds menu access to the support route required by FR-SUP-002. In-application support chat is deferred as FR-SUP-004","sec":"19 Results Center and the Main Menu"},"FR-PRT-005":{"m":"4","t":"The main menu shall give access to the Privacy Policy and the Terms and Conditions, presented in an in-application web view.","src":"Product requirement; SRS CON.1","note":"States the presentation mechanism and the menu route for FR-CNS-001, which requires the documents to be viewable. Realised by staticData.privacyUrl and staticData.termsUrl","sec":"19 Results Center and the Main Menu"},"FR-PRT-008":{"m":"5","t":"The software shall allow the user to open a configured web page from the application.","src":"SRS TSM.43; formerly BL-10","note":"Future development, formerly BL-10. The survey web view in FR-SUR-001 is in this version and is separate from this item.","sec":"19 Results Center and the Main Menu"},"FR-PRT-009":{"m":"5","t":"The results center shall enable the user to view the results letter.","src":"Product requirement; formerly BL-16","note":"Future development, formerly BL-16. Part of the results center screen required by FR-PRT-001. Overlaps FR-SHR-015, which covers generation, saving and email sharing as one item; the two should be merged when the milestone-5 set is reconciled.","sec":"19 Results Center and the Main Menu"},"FR-PRT-010":{"m":"5","t":"The results center shall enable the user to share the results letter.","src":"Product requirement; formerly BL-17","note":"Future development, formerly BL-17. Part of the results center screen; overlaps FR-SHR-015 as above.","sec":"19 Results Center and the Main Menu"},"FR-PRT-011":{"m":"5","t":"The results center shall enable the user to view further information about their result.","src":"Product requirement; formerly BL-18","note":"Future development, formerly BL-18. Part of the results center screen. Realised by resultPortalMoreInfoUrl, already set for normal and abnormal results. Distinct from the explanatory material required at the point of result delivery by FR-TXT-019, which is in scope now.","sec":"19 Results Center and the Main Menu"},"FR-PRT-012":{"m":"5","t":"The software shall present a post-test lobby as the state of the home screen following a successful test, comprising a checklist of post-test actions each with an open or closed presentation state and a done or not-done completion state, and a control that navigates to the results center. The lobby shall be shown for a configured period after the most recent result, after which the home screen returns to its regular state.","src":"Post test lobby redesign spec (lobby 4); formerly BL-36","note":"Future development, formerly BL-36. The screen and its mechanics. Realised by staticData.resultsLobbyDuration, currently 90 days. Detailed behaviour, including the four state combinations per item, the collapse and expand rules and the row confirming a test was performed, is specified in the lobby spec and is not reproduced here.","sec":"19 Results Center and the Main Menu"},"FR-PRT-013":{"m":"5","t":"The post-test lobby shall present the post-test actions defined for the result type, comprising sharing the results letter and booking an appointment for a positive result, sharing the doctor's information according to the primary care provider questionnaire, a simplified layout without actions for a normal result, and a control to start a new test.","src":"Settled at review: the application may retain a non-revealing indicator of recent result positivity and use that to decide what to present, following the existing kidney application, rather than depending on the backend to supply positivity. Post test lobby redesign spec (lobby 4); formerly BL-37","note":"Future development, formerly BL-37. The action set. Gated per partner by staticData.additionalResultsCTA for the appointment action. Requires result positivity to be available to the application, which the lobby spec records as an open backend dependency. Sharing depends on FR-SHR-012 and FR-PRT-009; starting a new test is subject to FR-KIT-007.","sec":"19 Results Center and the Main Menu"},"FR-PRT-014":{"m":"5","t":"The results center shall omit a next-steps section, shall present a view-results-letter control within its further-information area, and shall present the result explanation collapsed when the results center is opened.","src":"Post test lobby redesign spec (lobby 4), phase 2; formerly BL-39","note":"Future development, formerly BL-39. Results center changes accompanying the lobby redesign. Interacts with FR-PRT-001, FR-PRT-009 and FR-PRT-011.","sec":"19 Results Center and the Main Menu"},"FR-PRT-015":{"m":"5","t":"The results center shall provide a results history screen presenting the user's last five results, reachable only where more than one result exists.","src":"Product requirement; formerly part of FR-PRT-001; formerly BL-42","note":"Future development, formerly BL-42. Separated from FR-PRT-001 at review. The results center main screen shows the most recent result and is milestone 3; this history screen is future development. Realised by portalResultsHistoryEnabled.","sec":"19 Results Center and the Main Menu"},"FR-SHR-001":{"m":"3","t":"The backend data model shall be segmented by partnering organisation, enforcing logical data isolation so that records belonging to one health provider are inaccessible to another, and each patient shall be mapped to a single medical provider organisation, in a manner that supports both prescription generation and the return of results to the prescribing doctor.","src":"RA 6.3; SRS-BE LOG.3","note":"Backend. Multi-tenancy isolation stated explicitly from the backend SRS","sec":"20 Result Routing and Provider Communication"},"FR-SHR-002":{"m":"3","t":"The system shall route test result data according to the medical provider organisation associated with the patient.","src":"RA 6.3","note":"Backend","sec":"20 Result Routing and Provider Communication"},"FR-SHR-003":{"m":"3","t":"The backend shall map each test result to the patient record associated with the verified user token used to submit the test.","src":"RA 6.4","note":"Backend; see FR-AUT-013","sec":"20 Result Routing and Provider Communication"},"FR-SHR-004":{"m":"3","t":"Each medical provider organisation shall have a separate integration setup and configuration.","src":"RA 6.3","note":"Backend","sec":"20 Result Routing and Provider Communication"},"FR-SHR-005":{"m":"3","t":"Integration protocols with medical providers shall be based on industry standards, using HL7 for data integrity. The provider-specific protocol and data mapping shall be documented and agreed with the provider before implementation, and access shall be denied to unauthorised addresses.","src":"RA 6.1; SRS-BE EX.2, EX.5","note":"Backend. Address restriction added from the backend SRS. HISP delivery to primary care providers was separated at review and is deferred as FR-SHR-017","sec":"20 Result Routing and Provider Communication"},"FR-SHR-006":{"m":"3","t":"The provider communication protocol shall include handshake and acknowledgement mechanisms that verify successful transmission of test result data.","src":"RA 6.2","note":"Backend","sec":"20 Result Routing and Provider Communication"},"FR-SHR-007":{"m":"3","t":"The backend shall identify failed provider transmissions and shall retry transmission when communication with the medical provider becomes available.","src":"RA 6.2","note":"Backend","sec":"20 Result Routing and Provider Communication"},"FR-SHR-008":{"m":"3","t":"The backend shall reject malformed or nonconforming provider transmissions.","src":"RA 6.1","note":"Backend","sec":"20 Result Routing and Provider Communication"},"FR-SHR-011":{"m":"TBD","t":"The configuration shall state, for each partner, whether doctor-to-patient engagement takes place within the application or outside it, and the software shall present the corresponding post-result journey.","src":"Review item R-11","note":" Determines whether the future-development chat and consultation features, FR-SHR-013 and FR-SHR-014, are in scope for a given partner","sec":"20 Result Routing and Provider Communication"},"FR-SHR-012":{"m":"5","t":"The software shall provide the user with an option to share test results with their primary care provider.","src":"SRS CON.5, TSM.46; formerly BL-06","note":"Future development, formerly BL-06. Consolidates two deferred requirements.","sec":"20 Result Routing and Provider Communication"},"FR-SHR-013":{"m":"5","t":"The software shall enable the user to initiate a chat with a doctor before starting a test or after completing one.","src":"SRS TSM.39; formerly BL-08","note":"Future development, formerly BL-08. Scope determined by FR-SHR-011.","sec":"20 Result Routing and Provider Communication"},"FR-SHR-014":{"m":"5","t":"The software shall allow the user to call a primary care provider or care team using a configured phone number.","src":"SRS TSM.42; formerly BL-09","note":"Future development, formerly BL-09.","sec":"20 Result Routing and Provider Communication"},"FR-SHR-015":{"m":"5","t":"The software shall allow the generation of a results letter in PDF format, and shall allow the user to save it to the smartphone and share it by email.","src":"SRS TSM.36, TSM.37, TSM.38; SRS-BE COM.10; formerly BL-11","note":"Future development, formerly BL-11. Confirmed for future development. The backend SRS requires letter generation and transmission as SRS-BE COM.10.","sec":"20 Result Routing and Provider Communication"},"FR-SHR-016":{"m":"5","t":"Where completing a results-sharing action requires an application outside this one, the software shall hand off to that application. Hand-off shall be limited to applications explicitly configured for that purpose, shall be initiated only by an action the user has taken, and shall pass no more information than the sharing action requires.","src":"SRS TSM.44; review register Q-20; formerly BL-41","note":"Future development, formerly BL-41. Stated generally rather than naming a particular application. The guard is deliberate: SRS TSM.44 permitted launching arbitrary applications, which had no stated purpose and no security rationale.","sec":"20 Result Routing and Provider Communication"},"FR-SHR-017":{"m":"5","t":"The provider integration shall support the HISP protocol for secure delivery of results to primary care providers.","src":"RA 6.1; SRS-BE EX.2, EX.5; formerly part of FR-SHR-005; formerly BL-43","note":"Future development, formerly BL-43. Separated from FR-SHR-005 at review. HL7 and the documented per-provider mapping remain in the body at milestone 3; HISP delivery is future development.","sec":"20 Result Routing and Provider Communication"},"FR-SHR-018":{"m":"5","t":"The software shall determine whether a configured sharing application is present on the device, and shall present the sharing options that apply accordingly.","src":"Review comment; supports FR-SHR-016; formerly BL-44","note":"Future development, formerly BL-44. With the rest of user-initiated sharing. Detection is limited to applications explicitly configured for sharing, which is the same allow-list FR-SHR-016 restricts hand-off to; neither platform permits enumerating what else is installed.","sec":"20 Result Routing and Provider Communication"},"FR-SUP-002":{"m":"3","t":"The software shall enable the user to contact the support team by telephone or by email.","src":"SRS STM.10; SPTA 5.2","note":"Split per review. Realised by staticData.supportNumber and staticData.supportEmail. SPTA 5.2 relies on support offering workarounds during a third-party outage","sec":"21 Support and Help"},"FR-SUP-003":{"m":"3","t":"Where the software blocks the user from proceeding and the user cannot resolve the condition themselves, it shall present support contact information.","src":"RA 4.15, 4.16","note":"Content per FR-TXT-020","sec":"21 Support and Help"},"FR-SUP-001":{"m":"5","t":"The software shall provide a Frequently Asked Questions page, reachable from the main menu.","src":"SRS STM.9 and FR-PRT-006; formerly BL-19, restored to its original identifier","note":"Future development, formerly BL-19. Consolidated per review into a single entry covering both the page and its menu route. Realised by staticData.faqUrl.","sec":"21 Support and Help"},"FR-SUP-004":{"m":"5","t":"The software shall enable the user to initiate a chat session with a support agent.","src":"SRS STM.10; SRS-BE EX.6, SEC.9; formerly BL-40, restored to its original identifier","note":"Future development, formerly BL-40. Support by telephone and email remains in the body as FR-SUP-002. The backend SRS requires the chat endpoint and TLS 1.3 with AES-256 at rest for chat content.","sec":"21 Support and Help"},"FR-SUP-005":{"m":"3","t":"Where a test is invalidated, the software shall ask the user whether the kit had already been used for a practice or dry run, so that a kit spent in practice is distinguished from a test that failed for another reason.","src":"SPEC-04 review","note":"Added at Guy's direction. The predecessor already carries the idea of a run that does not count, reached through the troubleshooting conversation; what it has no way of establishing is whether the kit in hand was spent that way, which changes both the explanation and the corrective action. Reason categories come from FR-ALG-012 and the messaging from FR-TXT-021","sec":"21 Support and Help"},"FR-ANL-001":{"m":"3","t":"The software shall record analytics events for the user's progress through the test flow, including step entry and completion, blocking conditions raised, scan attempts and their outcomes, and test completion or invalidation, and shall transmit them to the analytics service.","src":"Review comment","note":" Analytics service is Mixpanel; realised by mixpanelProxyEnabled","sec":"22 Analytics and User Feedback"},"FR-ANL-002":{"m":"3","t":"The software shall not include personal information, health information or test result values in any analytics event.","src":"Review comment; RA 6.3; SRS ATT.6; SPTA 4.1","note":"Extends FR-SEC-005 to the analytics path, and applies equally to the audit events required by FR-SEC-013","sec":"22 Analytics and User Feedback"},"FR-ANL-003":{"m":"3","t":"The software shall associate analytics events with a pseudonymous identifier that cannot be resolved to a patient by the analytics service.","src":"Review comment","note":"","sec":"22 Analytics and User Feedback"},"FR-ANL-005":{"m":"3","t":"Failure of the analytics service, or unavailability of the analytics endpoint, shall not prevent a test from being started, completed, or reported.","src":"Review comment; derived","note":" Analytics is not permitted to become a dependency of the clinical flow","sec":"22 Analytics and User Feedback"},"FR-ANL-004":{"m":"5","t":"The software shall transmit analytics events through the configured proxy endpoint rather than directly to the analytics provider.","src":"Review comment; formerly BL-28, restored to its original identifier","note":"Future development, formerly BL-28. Analytics events will reach the provider directly rather than through the proxy until this is implemented; FR-ANL-002 and FR-ANL-003 still bar personal and health information.","sec":"22 Analytics and User Feedback"},"FR-ANL-006":{"m":"5","t":"The software shall present the configured survey to the user after test completion, opening it in an in-application web view.","src":"Review comment; SRS-adjacent; formerly BL-29, originally FR-SUR-001","note":"Future development, formerly BL-29. The post-test survey as a whole moves with FR-ANL-007 and FR-ANL-008.","sec":"22 Analytics and User Feedback"},"FR-ANL-007":{"m":"5","t":"The software shall permit the user to decline or dismiss the survey, and shall not require its completion in order to reach the test result or the results center.","src":"Review comment; derived; formerly BL-30, originally FR-SUR-002","note":"Future development, formerly BL-30. With FR-ANL-006.","sec":"22 Analytics and User Feedback"},"FR-ANL-008":{"m":"5","t":"The survey web view shall be presented only after the result has been delivered, and shall not be capable of interrupting an active test.","src":"Derived; formerly BL-31, originally FR-SUR-003","note":"Future development, formerly BL-31. With FR-ANL-006.","sec":"22 Analytics and User Feedback"},"FR-ANL-009":{"m":"5","t":"The software shall present the operating system's application-store rating prompt.","src":"—; formerly BL-32, originally FR-SUR-004","note":"Future development, formerly BL-32. The application-store rating prompt depends on the chat flow, which is itself deferred.","sec":"22 Analytics and User Feedback"},"FR-SEC-001":{"m":"3","t":"The software shall encrypt all sensitive data stored on the device, and shall store only the data required to complete the test and deliver the result.","src":"SRS ATT.3; SPTA 4.1","note":"Minimisation obligation added from the threat analysis; retention is bounded by FR-SEC-006","sec":"23 Security and Data Protection"},"FR-SEC-002":{"m":"3","t":"The software shall be published with code obfuscation enabled on the Android platform.","src":"SRS ATT.4; SPTA 4.11","note":"Applicable to Android only; iOS has no obfuscation. Agrees with SPTA 4.11. Settled at review; see decision log Q-14","sec":"23 Security and Data Protection"},"FR-SEC-003":{"m":"3","t":"The software shall be published with all debugging functionality and development tools disabled, so that a debugger cannot be attached to a release build.","src":"SRS ATT.5; SPTA 4.13","note":"","sec":"23 Security and Data Protection"},"FR-SEC-004":{"m":"3","t":"If an error message occurs, the software shall ensure that no personal information or sensitive details are disclosed to the user.","src":"SRS ATT.6","note":"Content per FR-TXT-020. Technical detail is separately constrained by FR-SEC-010","sec":"23 Security and Data Protection"},"FR-SEC-005":{"m":"3","t":"The software shall not write personal or health information to application logs or crash reports.","src":"Derived; see SPTA","note":"See also FR-ANL-002","sec":"23 Security and Data Protection"},"FR-SEC-006":{"m":"3","t":"The software shall retain test data on the device only for as long as required to complete transmission, and shall delete it upon backend acknowledgement.","src":"SRS TSM.27; FR-COM-007","note":"","sec":"23 Security and Data Protection"},"FR-SEC-007":{"m":"3","t":"The software shall prevent the user from taking a screenshot of any screen containing personal, health or result information, and shall obscure such content when the application is backgrounded or when the operating system captures a preview of it, so that it is not exposed in the application switcher.","src":"SRS ATT.2; SPTA 4.14","note":"Screenshot prevention added from the threat analysis. This is the sole control for SPTA 4.14, gross score 12","sec":"23 Security and Data Protection"},"FR-SEC-008":{"m":"3","t":"The software shall not persist any authentication credential, password or long-lived secret on the device. Authentication shall be performed server-side, and a retained session token shall not by itself grant access after sign-out or after the session has expired.","src":"SPTA 1.5","note":"New from the threat analysis. SPTA 1.5 scores 16 gross; the stated control is server-side authentication with persistent authentication removed","sec":"23 Security and Data Protection"},"FR-SEC-009":{"m":"3","t":"The software shall store cryptographic keys and session tokens only in the platform-provided secure storage, being the iOS Keychain or the Android Keystore, and shall not write them to application files, shared preferences or any location readable by another application.","src":"SPTA 4.7","note":"New from the threat analysis","sec":"23 Security and Data Protection"},"FR-SEC-010":{"m":"3","t":"Error messages presented to the user shall be generic, and shall not disclose internal technical information including stack traces, class or method names, file paths, backend endpoints, component versions or database detail.","src":"SPTA 1.3","note":"New from the threat analysis. Distinct from FR-SEC-004, which concerns personal information","sec":"23 Security and Data Protection"},"FR-SEC-011":{"m":"3","t":"The software shall validate and sanitise all user-supplied input before using it, storing it or transmitting it to the backend, accepting only values conforming to the expected type, length and character set for that field.","src":"SPTA 2.1","note":"New from the threat analysis. The field-specific rules in FR-AUT-002, FR-AUT-008 and FR-ACC-004 are instances of this requirement, not a substitute for it","sec":"23 Security and Data Protection"},"FR-SEC-012":{"m":"3","t":"Release artefacts for both platforms, being the iOS IPA and the Android APK or AAB, shall be encrypted.","src":"SPTA 4.11","note":"New from the threat analysis. Process requirement, verified at release","sec":"23 Security and Data Protection"},"FR-SEC-013":{"m":"4","t":"The software shall report security-relevant events to the backend for audit logging, including authentication attempts and their outcome, PIN entry failures, device-integrity check failures, and any condition that caused a test to be blocked from starting. These events shall carry no personal or health information.","src":"SPTA 3.1, 3.2","note":"New from the threat analysis. This is an audit channel distinct from the analytics events required by section 21; FR-ANL-002 applies to both","sec":"23 Security and Data Protection"},"FR-SEC-014":{"m":"1","t":"The software shall not transmit personal or health information from any build in which the transport controls of FR-COM-001 and FR-COM-002 are not fully implemented. Such a build shall be used only with data that did not come from a patient.","src":"Review decision CR-21; SPTA 2.11, 4.12","note":"Added at review. Test data upload is at milestone 1 while TLS enforcement and certificate pinning are at milestone 3, so this states the constraint that keeps patient data out of the milestone-1 build","sec":"23 Security and Data Protection"},"FR-CFG-001":{"m":"2","t":"The software shall retrieve its configuration set from the backend before a test may be started. The set comprises every server-supplied value that governs the behaviour of the application, including those resolved for the application and for the partner associated with the authenticated user. Where retrieval has not yet completed, the software shall indicate that it is not yet ready, and shall not present the condition as a failure.","src":"Config register","note":"Broadened at review: the partner-specific values are part of the set rather than the whole of it","sec":"24 Application Configuration"},"FR-CFG-002":{"m":"2","t":"If the configuration set cannot be retrieved, or fails validation against the defined schema, the software shall prevent a test from being started and shall not substitute a configuration set embedded in the application build. Where a retrieved and valid set does not supply an individual value, the software shall apply the default defined in the application for that value.","src":"Config register; derived from RA 4.18, 4.22","note":"","sec":"24 Application Configuration"},"FR-CFG-003":{"m":"3","t":"The software shall record, in the test record transmitted to the backend, the identity and version of the configuration set that was in force for that test.","src":"Config register; supports RA 4.22; formerly BL-33, restored to its original identifier","note":"Brought into scope at Guy's direction, formerly BL-33. A completed test carries the configuration it ran under, so a test's configuration can be reconstructed after the fact. It depends on the configuration set that FR-CFG-001 requires, which moved to milestone 2 at the SPEC-04 review; this stays at 3 because recording the set with the test record is a submission obligation rather than something the demonstration or the usability rehearsal needs. Closes Q-32.","sec":"24 Application Configuration"},"FR-CFG-004":{"m":"2","t":"Demonstration and mock result behaviour shall be enforced server-side. The backend shall not return a demonstration or mock result for a partner that is not designated as a demonstration partner, irrespective of any value supplied by the application.","src":"Config register; RA 4.21; formerly BL-34, restored to its original identifier","note":"Brought into scope for the demonstration at Guy's direction, formerly BL-34. The clause requiring a demonstration result to be labelled was removed at Rev 1.19 per Q-100, because FR-RES-006 already carries that obligation, leaving this a backend rule alone. Server-side enforcement matters because demonstration mode is a state the backend returns with the configuration, so nothing held on the device can be relied on to keep a demonstration result away from a patient. Settles the doubt recorded against Q-31.","sec":"24 Application Configuration"},"FR-CFG-006":{"m":"3","t":"Where the configuration places the application in a blocked state, the software shall prevent a test from being started, shall inform the user of the reason, and shall provide support contact information.","src":"Config register; formerly BL-35, restored to its original identifier","note":"Brought into scope for the submission at Guy's direction, formerly BL-35. The configured blocked state is a response the product already returns and has screens for; SPEC-01 proposed promoting it. The blocking, notifying and configured-off distinction applies: this one blocks.","sec":"24 Application Configuration"},"FR-CFG-008":{"m":"5","t":"The software shall support the integration of components required for the A/B testing interface.","src":"SRS EX.2; formerly BL-07","note":"Future development, formerly BL-07. The abTestingEnabled configuration is out of scope; reinstate with this item.","sec":"24 Application Configuration"},"FR-LCM-002":{"m":"3","t":"Off-the-shelf software components shall be evaluated before integration to confirm their suitability, compatibility, and impact on device safety and performance, and shall be obtained only from official sources.","src":"RA 4.20; SPTA 2.6, 8.1","note":"Process","sec":"25 Software Lifecycle and Verification"},"FR-LCM-003":{"m":"3","t":"Off-the-shelf software components and their updates shall be validated within the complete device software system before release.","src":"RA 4.20","note":"Process","sec":"25 Software Lifecycle and Verification"},"FR-LCM-004":{"m":"3","t":"The versions and configurations of off-the-shelf software components shall be controlled and recorded, with a continuous inventory maintained by a dependency scanning tool.","src":"RA 4.20; SPTA 2.6, 2.7, 8.1","note":"Process. SPTA 8.1 requires scanning weekly and on every update to an off-the-shelf component","sec":"25 Software Lifecycle and Verification"},"FR-LCM-005":{"m":"3","t":"Updates, patches, known anomalies, security vulnerabilities and supplier notifications associated with off-the-shelf software components shall be monitored throughout the software lifecycle, and identified changes shall be assessed through the established change-control and risk-management processes.","src":"RA 4.20; SPTA 2.7, 8.1","note":"Process. SPTA 2.7 additionally requires subscription to vulnerability bulletins including the CISA Known Exploited Vulnerabilities Catalog","sec":"25 Software Lifecycle and Verification"},"FR-LCM-006":{"m":"3","t":"Every parameter identified in the system-parameter appendix shall have a defined value, permitted range and documented rationale before design verification, and shall be held under configuration control whether it is fixed in the application or supplied by configuration.","src":"RA 4.18","note":"Process","sec":"25 Software Lifecycle and Verification"},"FR-LCM-007":{"m":"3","t":"Each timer and timing window shall be separately verified through release testing, including verification under application backgrounding and interruption.","src":"RA 4.18","note":"Process","sec":"25 Software Lifecycle and Verification"},"FR-LCM-008":{"m":"4","t":"Regression testing of the timing and test-state controls shall be performed for each applicable software release.","src":"RA 4.18","note":"Process","sec":"25 Software Lifecycle and Verification"},"FR-LCM-009":{"m":"3","t":"Each algorithm version, and each approved combination of mobile and backend algorithm versions, shall undergo software verification and validation before release. Where a full analytical performance study is not repeated, regression testing shall be performed against the validated reference algorithm using predefined datasets and acceptance criteria.","src":"RA 4.21","note":"Process","sec":"25 Software Lifecycle and Verification"},"FR-LCM-010":{"m":"3","t":"Release verification shall confirm that the approved algorithm versions and configuration were deployed to the production environment.","src":"RA 4.22","note":"Process","sec":"25 Software Lifecycle and Verification"},"FR-LCM-011":{"m":"3","t":"Retention and recovery of test state following interruption shall be verified through release testing, and application termination and reopening during each stage of the test flow shall be verified.","src":"RA 4.1, 7.19","note":"Process","sec":"25 Software Lifecycle and Verification"},"FR-LCM-012":{"m":"3","t":"Usability testing shall include representatives of each supported platform and shall evaluate foreseeable interruptions before, during and after result-critical user actions.","src":"RA 4.1, 4.2, 4.7","note":"Process","sec":"25 Software Lifecycle and Verification"},"FR-LCM-016":{"m":"4","t":"A dedicated integration testing phase shall be conducted with each medical provider before go-live, verifying connectivity, the accurate transmission and mapping of test result data, routing to the correct provider destination, and the handling of unsuccessful transmissions.","src":"RA 6.1, 6.2, 6.3","note":"Process; per provider organisation","sec":"25 Software Lifecycle and Verification"},"FR-LCM-017":{"m":"3","t":"Release testing shall be performed before each release, comprising integration, system and regression testing, as detailed in the Software Development Plan. Unit testing and other development standards are specified separately in that plan.","src":"RA 4.21","note":"Process","sec":"25 Software Lifecycle and Verification"},"FR-LCM-018":{"m":"5","t":"A change to any configuration value recorded in the Application Configuration Register as realising a requirement shall be assessed under the established change-control and risk-management processes before it is applied to the production environment.","src":"Formerly a requirement in the configuration section; formerly BL-15","note":"Future development, formerly BL-15.","sec":"25 Software Lifecycle and Verification"}}};
const MSNAME={"1":"Demo","2":"Usability rehearsal","3":"Submission must","4":"Clinical high","5":"Future development"}, KIND={"app":"Application","backend":"Backend / algorithm","content":"Content","process":"Process"}, DOMAINS=["iOS","Android","Backend","Algo","Content","Process"];
const SPECORDER=["New","Changed","Unchanged","No spec"], READINESS={"start":"Can start now","wait":"Waiting on a spec","other":"Not application code"};
const state={ms:new Set(),kd:new Set(),dm:new Set(),sp:new Set(),rd:new Set(),q:"",view:"epic"};

function bcls(f){ if(f.first) return "b"+f.first; return "btbd"; }
function blab(f){ if(!f.first) return "TBD";
  return "M"+f.first+(f.last!==f.first?"–M"+f.last:"")+(f.tbd?" +TBD":""); }
function keys(f){ const k=[]; if(f.first){for(let i=f.first;i<=f.last;i++)k.push(String(i));} if(f.tbd)k.push("TBD"); return k; }

function match(f,e){
  if(state.kd.size&&!state.kd.has(e.kind))return false;
  if(state.dm.size&&!(f.dom||[]).some(d=>state.dm.has(d)))return false;
  if(state.ms.size&&!keys(f).some(k=>state.ms.has(k)))return false;
  if(state.sp.size&&!state.sp.has(f.spec.status))return false;
  if(state.rd.size&&!state.rd.has(f.spec.readiness))return false;
  if(state.q){const q=state.q.toLowerCase();
    const hay=[f.id,f.name,f.intent,f.ux,...(f.dom||[]),...f.fr,e.code,e.title,
               f.spec.status,f.spec.note||"",f.spec.doc||""].join(" ").toLowerCase();
    const rt=f.fr.map(i=>D.req[i].t).join(" ").toLowerCase();
    if(!hay.includes(q)&&!rt.includes(q))return false;}
  return true;
}

function fcard(f,e){
  const ids=f.fr.map(i=>'<span class="id'+(D.req[i].m==="5"?' m5':'')+'" onclick="showR(\''+i+'\')">'+i.replace(/^FR-/,'')+'</span>').join("");
  const sp = f.split ? '<div class="sp">'+f.split.map(x=>{
      const k=x[0].toLowerCase().replace('m','m').replace(/s/g,'');
      const cls = x[0]==='TBD'?'sptbd':(x[0]==='Deferred'?'spdef':'sp'+x[0].toLowerCase());
      return '<b class="'+cls+'">'+x[0]+'</b><span>'+x[1]+'</span>';}).join('')+'</div>' : '';
  const dm = (f.dom&&f.dom.length) ? '<div class="dm">'+f.dom.map(d=>'<span class="'+d+'">'+d+'</span>').join('')+'</div>' : '';
  const S=f.spec;
  const scls='s'+S.status.replace(/s/g,'');
  const doc = S.doc ? ('Spec: QACR-APP-'+S.doc+' — '+S.stateLabel) : 'No spec document is coming';
  const sn = '<div class="sn '+S.readiness+'"><span class="rl">'+READINESS[S.readiness]+'</span>'
           + (S.note||'')
           + (S.src==='derived'?'<span class="dv">Read off the requirements, not confirmed by product.</span>':'')
           + '<span class="dc">'+doc+'</span></div>';
  return '<div class="f"><div class="fh"><span class="fid">'+f.id+'</span><span class="badge '+bcls(f)+'">'+blab(f)+'</span>'
   +'<span class="sb '+scls+'">'+S.status+'</span></div>'
   +dm+'<div class="fn">'+f.name+'</div><div class="fi">'+f.intent+'</div>'+sn+sp
   +(f.ux?'<div class="fux">'+f.ux+'</div>':'')+'<div class="ids">'+(ids||'—')+'</div></div>';
}

function cnt(p){let n=0;D.epics.forEach(e=>e.features.forEach(f=>{if(p(f))n++;}));return n;}
function render(){
  let nf=0,nr=0;
  const body=document.getElementById("body");
  if(state.view==="epic"){
    body.innerHTML=D.epics.map(e=>{
      const fs=e.features.filter(f=>match(f,e));
      if(!fs.length)return "";
      nf+=fs.length; fs.forEach(f=>nr+=f.fr.length);
      const rr=e.features.flatMap(f=>f.fr);
      const ms=rr.map(i=>D.req[i].m).filter(m=>m!=="TBD").map(Number);
      const span=ms.length?("M"+Math.min(...ms)+(Math.max(...ms)!==Math.min(...ms)?"–M"+Math.max(...ms):"")):"deferred";
      return '<div class="epic"><div class="eh"><span class="ec">'+e.code+'</span><span class="et">'+e.title+'</span>'
        +'<span class="meta">'+KIND[e.kind]+' · '+span+' · '+rr.length+' requirements · '+rr.filter(i=>D.req[i].m==="5").length+' future development</span></div>'
        +'<div class="esum">'+e.summary+'<br><span style="color:#93a0b2">Journey: '+e.journey+'</span></div>'
        +'<div class="feats">'+fs.map(f=>fcard(f,e)).join("")+'</div>'
        +(e.open.length?'<div class="open"><b>Open items bearing on this epic</b>'+e.open.map(o=>'<div>· '+o+'</div>').join("")+'</div>':'')
        +'</div>';
    }).join("")||'<div class="empty">Nothing matches those filters.</div>';
  } else if(state.view==="ms"){
    const groups=[["1"],["2"],["3"],["4"],["5"],["TBD"]];
    body.innerHTML=groups.map(([g])=>{
      const rows=[];
      D.epics.forEach(e=>e.features.forEach(f=>{
        if(!match(f,e))return;
        const first=f.first?String(f.first):"TBD";
        if(first!==g)return;
        rows.push({f,e});
      }));
      if(!rows.length)return "";
      nf+=rows.length; rows.forEach(r=>nr+=r.f.fr.length);
      const title=g==="TBD"?"Priority undecided":"Milestone "+g+" — "+MSNAME[g];
      return '<div class="epic"><div class="eh"><span class="ec">'+g+'</span><span class="et">'+title+'</span>'
        +'<span class="meta">'+rows.length+' features first needed here</span></div>'
        +'<div class="feats">'+rows.map(r=>fcard(r.f,r.e).replace('<div class="fn">','<div class="fn"><span style="color:#93a0b2;font-weight:600;font-size:11px">'+r.e.code+' </span>')).join("")+'</div></div>';
    }).join("")||'<div class="empty">Nothing matches those filters.</div>';
  } else {
    const order=["start","wait","other"];
    const blurb={start:"Nothing is coming that changes these, or what is coming only records what already exists. Build them from the existing application.",
                 wait:"A spec is being written. Starting these before it lands risks building the wrong thing.",
                 other:"Not application code — content, process or algorithm work."};
    body.innerHTML=order.map(g=>{
      const rows=[];
      D.epics.forEach(e=>e.features.forEach(f=>{ if(match(f,e)&&f.spec.readiness===g) rows.push({f,e}); }));
      if(!rows.length)return "";
      nf+=rows.length; rows.forEach(r=>nr+=r.f.fr.length);
      rows.sort((a,b)=>(a.f.first||99)-(b.f.first||99)||a.f.id.localeCompare(b.f.id));
      const by={}; rows.forEach(r=>by[r.f.spec.status]=(by[r.f.spec.status]||0)+1);
      const mix=SPECORDER.filter(k=>by[k]).map(k=>by[k]+" "+k).join(" · ");
      return '<div class="epic"><div class="eh"><span class="ec">'+rows.length+'</span><span class="et">'+READINESS[g]+'</span>'
        +'<span class="meta">'+mix+'</span></div>'
        +'<div class="esum">'+blurb[g]+'</div>'
        +'<div class="feats">'+rows.map(r=>fcard(r.f,r.e).replace('<div class="fn">','<div class="fn"><span style="color:#93a0b2;font-weight:600;font-size:11px">'+r.e.code+' </span>')).join("")+'</div></div>';
    }).join("")||'<div class="empty">Nothing matches those filters.</div>';
  }
  document.getElementById("stats").innerHTML=
    '<div class="st"><b>'+nf+'</b><span>features shown</span></div>'
   +'<div class="st"><b>'+nr+'</b><span>requirements</span></div>'
   +'<div class="st"><b>'+D.epics.length+'</b><span>epics</span></div>'
   +'<div class="st"><b>'+cnt(f=>f.spec.readiness==="start")+'</b><span>can start now</span></div>'
   +'<div class="st"><b>'+cnt(f=>f.spec.readiness==="wait")+'</b><span>waiting on a spec</span></div>'
   +'<div class="st"><b>'+cnt(f=>f.spec.readiness==="other")+'</b><span>not app code</span></div>'
   +'<div class="st"><b>'+Object.values(D.req).filter(r=>r.m==="5").length+'</b><span>future development</span></div>';
  document.getElementById("note").innerHTML=
    "Milestones are derived from the priority of each requirement in QACR-APP-FR-01 Rev 1.27 and cannot be edited here. "
   +"Milestone 1 is mid-October 2026, 2 is early December, 3 and 4 are both early January 2027. A range means the feature is first needed at the earlier milestone and not complete until the later one. Click any requirement identifier to read it."
   +"<br><br><b>Spec status</b> says how much writing a spec needs, not whether the feature is in scope — milestone carries scope. "
   +"<b>Unchanged</b> means the behaviour is a recreation of Minuteful Kidney and the spec will record it rather than redesign it, so the work can start now. "
   +"<b>New</b> and <b>Changed</b> are waiting on a spec. <b>No spec</b> means nothing is coming at all: either the requirements are already the specification, or the work is content, process or algorithm."
   +"<br>Notes in each card are the product manager's own words except where marked as read off the requirements, which means they still need confirming.";
}

function showR(id){const r=D.req[id];
  document.getElementById("pc").innerHTML='<h3>'+id+'</h3><div class="meta">Milestone '+r.m+' · '+r.sec+'</div>'
   +'<div class="k">Requirement</div><p>'+r.t+'</p><div class="k">Traceability</div><p>'+(r.src||"—")+'</p>'
   +'<div class="k">Owned by</div><p>'+own(id)+'</p>';
  document.getElementById("panel").classList.add("on");}
function own(id){for(const e of D.epics)for(const f of e.features)
  if(f.fr.includes(id))return f.id+" "+f.name+" — "+e.code+" "+e.title; return "—";}
function closeP(){document.getElementById("panel").classList.remove("on");}

function chips(el,items,set){
  document.getElementById(el).innerHTML=items.map(i=>'<span class="chip '+(i.c||"")+'" data-k="'+i.k+'">'+i.l+'</span>').join("");
  document.getElementById(el).onclick=ev=>{const c=ev.target.closest(".chip"); if(!c)return;
    const k=c.dataset.k; set.has(k)?set.delete(k):set.add(k); c.classList.toggle("on"); render();};
}
chips("ms",[{k:"1",l:"M1 Demo",c:"m1"},{k:"2",l:"M2 Usability",c:"m2"},{k:"3",l:"M3 Must",c:"m3"},
            {k:"4",l:"M4 High",c:"m4"},{k:"5",l:"M5 Future",c:"m5"},{k:"TBD",l:"TBD",c:"tbd"}],state.ms);
chips("kd",Object.entries(KIND).map(([k,l])=>({k,l})),state.kd);
chips("dm",DOMAINS.map(d=>({k:d,l:d})),state.dm);
chips("sp",SPECORDER.map(k=>({k,l:k})),state.sp);
chips("rd",Object.entries(READINESS).map(([k,l])=>({k,l})),state.rd);
document.getElementById("q").oninput=e=>{state.q=e.target.value;render();};
document.getElementById("reset").onclick=()=>{state.ms.clear();state.kd.clear();state.dm.clear();state.sp.clear();state.rd.clear();state.q="";
  document.getElementById("q").value="";document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on"));render();};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");
  state.view=t.dataset.v;render();});
document.onkeydown=e=>{if(e.key==="Escape")closeP();};
render();
</script>
