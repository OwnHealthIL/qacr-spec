<!DOCTYPE html>
<meta charset="utf-8">
<title>QACR Epic and Feature Board</title>
<style>
:root{color-scheme:light;--ink:#16202e;--mut:#6b7789;--line:#dde3ec;--bg:#f6f8fb;--card:#fff;--acc:#1f3864;
--m1:#c6553f;--m2:#b07a1e;--m3:#1f3864;--m4:#5a739b;--m5:#6e7480;--tbd:#8a2f2f;--def:#8a6d3b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 26px 0;position:sticky;top:0;z-index:20}
h1{margin:0;font-size:19px;letter-spacing:-.2px}
h1 span{color:var(--mut);font-weight:400;font-size:14px;margin-left:10px}
.bar{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;padding:14px 0 0}
.grp{display:flex;flex-direction:column;gap:5px}
.grp label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:600}
.chips{display:flex;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--mut);white-space:nowrap;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.m1.on{background:var(--m1);border-color:var(--m1)}.chip.m2.on{background:var(--m2);border-color:var(--m2)}
.chip.m4.on{background:var(--m4);border-color:var(--m4)}.chip.m5.on{background:var(--m5);border-color:var(--m5)}.chip.tbd.on{background:var(--tbd);border-color:var(--tbd)}
.chip.def.on{background:var(--def);border-color:var(--def)}
input[type=search]{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;width:230px;font-family:inherit}
.tabs{display:flex;gap:0;margin:16px 0 0;border-bottom:1px solid var(--line)}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-weight:500}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
main{padding:22px 26px 90px}
.epic{background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:16px;overflow:hidden}
.eh{padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:baseline}
.eh:hover{background:#fbfcfe}
.ec{font-weight:700;color:var(--acc);font-size:13px;min-width:34px}
.et{font-weight:600;font-size:15px;flex:1}
.meta{font-size:11px;color:var(--mut)}
.esum{padding:0 18px 12px;font-size:12.5px;color:var(--mut);max-width:96ch}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;padding:12px 18px 18px}
.f{border:1px solid var(--line);border-radius:7px;padding:11px 12px;background:#fff}
.f.dim{opacity:.28}
.fh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.fid{font-weight:700;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;color:#fff;letter-spacing:.3px}
.b1{background:var(--m1)}.b2{background:var(--m2)}.b3{background:var(--m3)}.b4{background:var(--m4)}.b5{background:var(--m5)}
.btbd{background:var(--tbd)}.bdef{background:var(--def)}
.dm{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.dm span{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:1px 6px;border-radius:9px;background:#eef2f8;color:#3d4b60}
.dm .iOS{background:#e6eef6;color:#2b5878}.dm .Android{background:#e4f0ea;color:#245c44}
.dm .Backend{background:#eee7f6;color:#523a7a}.dm .Algo{background:#f7ece2;color:#7a4623}
.dm .Content{background:#f7f0e0;color:#7a6224}.dm .Process{background:#eef0f3;color:#535e6d}
.fn{font-weight:600;font-size:13.5px;margin-bottom:5px}
.fi{font-size:12px;color:#3c4859;margin-bottom:7px}
.sp{font-size:11.5px;color:#3c4859;margin:0 0 7px;display:grid;grid-template-columns:auto 1fr;gap:2px 6px}
.sp b{font-weight:700;white-space:nowrap}
.spm1{color:var(--m1)}.spm2{color:var(--m2)}.spm3{color:var(--m3)}.spm4{color:var(--m4)}.sptbd{color:var(--tbd)}.spdef{color:var(--def)}
.fux{font-size:11.5px;color:var(--mut);border-left:2px solid var(--line);padding-left:8px;margin-bottom:8px;font-style:italic}
.ids{display:flex;flex-wrap:wrap;gap:3px}
.id{font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef2f8;border-radius:3px;padding:2px 5px;cursor:pointer;color:#3d4b60}
.id:hover{background:var(--acc);color:#fff}
.id.m5{background:#eceff3;color:#5a6674;font-style:italic}
.open{padding:0 18px 16px;font-size:11.5px;color:var(--tbd)}
.open b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:4px}
.open div{margin:2px 0}
#panel{position:fixed;right:0;top:0;bottom:0;width:430px;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(20,30,50,.10);padding:22px 24px;overflow:auto;transform:translateX(100%);transition:transform .18s;z-index:40}
#panel.on{transform:none}
#panel .x{position:absolute;right:16px;top:14px;cursor:pointer;color:var(--mut);font-size:20px;line-height:1}
#panel h3{margin:0 0 3px;font-size:15px;color:var(--acc)}
#panel .k{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin:16px 0 3px;font-weight:600}
#panel p{margin:0;font-size:13px}
.stats{display:flex;gap:0;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:18px}
.st{flex:1;padding:12px 16px;border-right:1px solid var(--line)}
.st:last-child{border:0}
.st b{display:block;font-size:22px;font-weight:700;letter-spacing:-.5px}
.st span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.empty{color:var(--mut);font-size:13px;padding:30px 0;text-align:center}
.note{font-size:11.5px;color:var(--mut);margin:-6px 0 16px}
.sb{font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.sNew{background:#fde8e4;color:#a3341c}.sChanged{background:#fdf0dc;color:#8a5d10}
.sUnchanged{background:#e3f1e8;color:#1f5c3a}.sNospec{background:#eceff3;color:#5a6674}
.sn{font-size:11.5px;border-radius:6px;padding:7px 9px;margin-bottom:7px;background:#f7f9fc;border:1px solid #e7ecf3}
.sn.wait{background:#fdf6ee;border-color:#f0e0c9}
.sn.start{background:#f1f8f3;border-color:#d9eadf}
.sn.other{background:#f5f6f8;border-color:#e5e8ed}
.sn .rl{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.sn.wait .rl{color:#8a5d10}.sn.start .rl{color:#1f5c3a}.sn.other .rl{color:#5a6674}
.sn .dv{display:block;margin-top:4px;font-size:10.5px;color:#8a5d10;font-style:italic}
.sn .dc{display:block;margin-top:4px;font-size:10.5px;color:var(--mut);font-family:ui-monospace,Menlo,monospace}
</style>

const D={"epics":[{"code":"E01","title":"App Foundation and Device Readiness","kind":"app","journey":"Before anything else — install, launch, and every entry into a test","summary":"Everything the application must establish before a test may begin: that the device is supported and uncompromised, that battery, storage, camera and connectivity are sufficient, and that the run-time configuration has been retrieved. The governing principle is that a failed check blocks the test rather than warning the user, so this epic owns the blocked-state pattern that some twenty other requirements refer to.","open":["Q-01 battery threshold","Q-02 storage threshold","Q-03 supported OS range","Q-04 minimum hardware specification","Q-32 configuration-set version not recorded with the test"],"features":[{"id":"F01.1","name":"Store distribution and install-time compatibility","fr":["FR-PLT-001","FR-PLT-002","FR-PLT-003","FR-PLT-004"],"intent":"The application is published only to the Apple App Store and Google Play, with the stores' own hardware and OS filters set so that installation is prevented on unsupported models.","ux":"No UI. Needs the store listing, screenshots and the supported-device statement.","split":[["M3","Compatible with and installable on the supported iOS and Android versions, with the stores' own hardware and operating-system filters enabled so that an unsupported model cannot install."],["M4","Distribution restricted to the two application stores as the only channel."]],"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-01","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":4,"tbd":0},{"id":"F01.2","name":"Supported-device policy and run-time eligibility","fr":["FR-PLT-005","FR-RDY-002","FR-RDY-003","FR-RDY-004"],"intent":"A backend-held list of supported operating-system versions and minimum hardware, checked at run time, plus a check of the application's own version against the backend. Any of the three failing prevents further use.","ux":"Three blocking conditions with distinct copy: device unsupported, OS unsupported, update required. The version check is raised on a cold start and so is a full screen; the update case is the only one with an action the user can take, and it needs a route to the store.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-01","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F01.3","name":"Device integrity check","fr":["FR-RDY-001"],"intent":"Root detection on Android and jailbreak detection on iOS at start-up; a compromised device is blocked outright.","ux":"One terminal blocking screen with no route forward. Decide whether support contact is offered here at all.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-01","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F01.4","name":"Pre-test resource and permission checks","fr":["FR-RDY-005","FR-RDY-006","FR-RDY-007","FR-RDY-008","FR-RDY-009","FR-RDY-010"],"intent":"Internet connectivity, backend reachability, battery level, available storage and camera presence and permission, all re-evaluated immediately before a test starts and not only at launch.","ux":"Settled at review: the checks run silently while the user is on the home screen, and surface on failure when the user taps start test. There is no visible checklist. Connectivity failures raised on a cold start are full screens; the rest are alerts. The camera permission is the exception to all of it — requested inside the instructional flow at the point the scan is reached, so the user understands why it is being asked.","split":[["M1","The camera present and its permission granted, requested inside the flow at the point the scan is reached — the one check the demonstration needs, since the demonstration still has to scan."],["M3","Connectivity, backend reachability, battery level and available storage, all checked silently when the user taps start test, and re-run immediately before the test begins rather than only at launch."]],"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-01","state":"ready","stateLabel":"ready","readiness":"start"},"first":1,"last":3,"tbd":0},{"id":"F01.5","name":"Blocked-state pattern","fr":["FR-RDY-011","FR-SUP-003","FR-RDY-013","FR-RDY-014"],"intent":"A single reusable presentation for every condition that blocks the user: what was detected, what to do about it, and how to reach support. Used by readiness failures, kit failures, timing failures, scan failures and backend errors alike.","ux":"The highest-leverage component in the application. One template, parameterised. Two presentations, which is a user-interface decision rather than a requirement: conditions raised on a cold start are full screens, because an alert over the splash screen reads badly, and everything inside the flow is an alert. Content rules are FR-TXT-020; technical-detail suppression is FR-SEC-010. Support contact appears only where the user cannot resolve the condition themselves, and a retry only where retrying can succeed.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-01","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F01.6","name":"Deferred-upload recovery at start-up","fr":["FR-RDY-012"],"intent":"On launch the application determines whether data from an earlier test was transmitted and retries if not.","ux":"Runs silently. Decide whether the user is told a previous result is still on its way, and what the home screen shows while that is true.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-01","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F01.7","name":"Cross-platform behavioural parity","fr":["FR-PLT-006"],"intent":"iOS and Android must present the same instructional content, step sequence, confirmation behaviour and error handling.","ux":"A constraint on every screen in the application rather than a screen of its own. Worth stating in the design system.","split":null,"dom":["iOS","Android"],"spec":{"status":"No spec","note":"Not a feature with behaviour of its own. A constraint every other spec inherits: iOS and Android present the same content, step sequence, confirmation behaviour and error handling.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"start"},"first":2,"last":2,"tbd":0},{"id":"F01.8","name":"Device and version telemetry on the test record","fr":["FR-PLT-008"],"intent":"Smartphone model, OS version and application version travel with the test record for image-validation and post-market analysis.","ux":"No UI.","split":null,"dom":["iOS","Android","Algo"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-01","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F01.9","name":"Run-time configuration","fr":["FR-CFG-001","FR-CFG-002","FR-CFG-008","FR-LCM-018","FR-CFG-003","FR-CFG-004","FR-CFG-006"],"intent":"The application retrieves its configuration from the backend before a test may start — every server-supplied value that governs its behaviour, of which the partner-specific ones are only a part — and refuses to fall back to values baked into the build if retrieval or schema validation fails.","ux":"One blocking alert for configuration unavailable — the equivalent of the server-settings alert in the existing kidney application. The configured blocked state is now in scope at milestone 3, so it needs a defined response and a screen rather than being a gap.","split":[["M2","Retrieval and schema validation of the configuration set before a test may start, with no fallback to an embedded set, and server-side enforcement of demonstration and mock result behaviour. Both moved here at the SPEC-04 review: the configuration set stops being demonstration-only at milestone 2, when it also carries a real test partner, and server-side enforcement cannot precede the channel that delivers it."],["M3","A defined response to a configured blocked state, and the configuration set in force recorded with the test."]],"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-01","state":"ready","stateLabel":"ready","readiness":"start"},"first":2,"last":5,"tbd":0}]},{"code":"E02","title":"Identity, Authentication and Consent","kind":"app","journey":"First launch, and again whenever the session has expired","summary":"Establishing that the person holding the phone is the patient the kit was dispatched to, because that association determines which record the result is written to and which provider it is routed to. Patient records already exist when the kit ships, so the application verifies a date of birth against a record rather than creating one. Consent is taken at the same moment.","open":["Q-21 does doctor-to-patient engagement happen in the application","Q-23 whether the results center excludes results belonging to another user on the same phone number","Q-63 the session-token expiry period is wrong as stated","Q-65 which steps of the flow are conditional, and on what parameter"],"features":[{"id":"F02.1","name":"Phone number entry and lookup","fr":["FR-AUT-001","FR-AUT-002","FR-AUT-003","FR-AUT-023"],"intent":"The user enters a phone number, the format is validated locally, and the backend reports whether it is already registered.","ux":"Not the first screen: the onboarding sequence of F02.8 precedes it. Needs country-code handling, inline format validation and the consent checkbox from F02.7 on the same screen.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-02","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":5,"tbd":0},{"id":"F02.2","name":"One-time password verification","fr":["FR-AUT-004","FR-AUT-005","FR-AUT-018","FR-AUT-019","FR-AUT-024"],"intent":"A six-digit code sent by SMS is submitted and validated server-side against an attempt count and an expiry, with a lockout when the limit is reached. The user can ask for the code again, or go back and correct the number.","ux":"Code entry, a resend control that only becomes available after thirty seconds, a route back to phone entry, and a lockout state that says how long the wait is. Values are fixed: six digits, five minutes to expiry, five attempts, thirty seconds between resends, fifteen-minute lockout. Note that a resend spends an attempt, so the counter has to be visible enough that a user does not lock themselves out by pressing it.","split":[["M3","The user submits the code delivered by SMS and it is verified."],["M4","The attempt limit, the five-minute expiry, the fifteen-minute lockout that follows five failures, and acceptance of a code the platform enters automatically."]],"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-02","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":4,"tbd":0},{"id":"F02.3","name":"Invite code for unregistered numbers","fr":["FR-AUT-006"],"intent":"A phone number not already registered must present an invite code, which the backend validates for authenticity and expiry.","ux":"Follow the existing kidney application as a starting point.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-02","state":"ready","stateLabel":"ready","readiness":"start"},"first":4,"last":4,"tbd":0},{"id":"F02.4","name":"Date-of-birth confirmation at test start","fr":["FR-AUT-008","FR-AUT-010","FR-AUT-012","FR-AUT-020","FR-AUT-007","FR-AUT-011","FR-AUT-015"],"intent":"The user confirms their date of birth at the start of every test, independently of login, and a mismatch blocks the test behind a deliberately generic error. The date of birth is not requested at login in this version.","ux":"One screen at test start rather than a conditional login branch, since FR-AUT-009 is withdrawn. The behaviour ships behind a feature flag and is not shown to clinical-study participants; FR-FLW-006 is the requirement that provides that mechanism.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Changed","note":"Just the flag behavior (adding a “not shown” status)","src":"pm","doc":"SPEC-02","state":"ready","stateLabel":"ready","readiness":"wait"},"first":3,"last":5,"tbd":0},{"id":"F02.5","name":"Session and token lifecycle","fr":["FR-AUT-013","FR-AUT-014","FR-SEC-008","FR-COM-010","FR-AUT-021","FR-AUT-022"],"intent":"A token obtained on verification accompanies every request and expires after twenty-four hours. No credential is persisted on the device, and a retained token grants nothing after sign-out or expiry. The backend verifies the identity and authorisation carried by every incoming request and rejects any attempt to act on another patient's record.","ux":"Design owes the re-verification experience: what the user sees when a token expires, and whether it can happen mid-journey. The 24-hour expiry taken from the backend SRS was flagged at review as wrong for this application and is open as Q-63.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-02","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F02.6","name":"Authentication guidance and failure support","fr":["FR-AUT-016"],"intent":"Each authentication step is guided, and repeated failure surfaces support contact information.","ux":"Defines when the application stops retrying and starts helping. Uses the F01.5 pattern. Follow the existing kidney application as a starting point.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-02","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F02.8","name":"First-run onboarding","fr":["FR-AUT-017"],"intent":"Two or three screens on first launch, before authentication, introducing the application and the test, which the user may advance through or dismiss.","ux":"Added at review. Sits ahead of F02.1 in the journey. Content is part of the versioned set and subject to the reading level, so it is drafted with E07 rather than separately.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-02","state":"ready","stateLabel":"ready","readiness":"start"},"first":4,"last":4,"tbd":0},{"id":"F02.7","name":"Consent acknowledgement","fr":["FR-CNS-001","FR-CNS-002","FR-CNS-003","FR-CNS-005","FR-CNS-006","FR-CNS-007"],"intent":"The Privacy Policy and Terms and Conditions are viewable from the verification screen and the main menu, and a mandatory checkbox on phone-number entry gates progress.","ux":"Checkbox with inline links, presented without pre-selection. Recording which policy version was accepted is future development (FR-CNS-007, milestone 5), which design should know is not currently captured.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-02","state":"ready","stateLabel":"ready","readiness":"start"},"first":4,"last":5,"tbd":0}]},{"code":"E03","title":"Kit Identification and Eligibility","kind":"app","journey":"At the scan, and at the moment a test is started","summary":"Ensuring only an authentic, unused kit produces a result. The design constraint that shapes this epic is that the kit identifier is printed on the Test Board and is therefore read during the scan, at the very end of the physical procedure — so reuse is detected rather than prevented, and the alert at test start is the only forward-looking control.","open":["Q-15 the Risk Analysis says reuse is prevented; the application can only detect it at scan"],"features":[{"id":"F03.1","name":"QR capture and kit validation","fr":["FR-KIT-001","FR-KIT-002","FR-KIT-003","FR-KIT-008","FR-KIT-009"],"intent":"The QR code on the Test Board is located, read, validated against the identifier template and checked against the backend register of used kits. A code that cannot be read does not stop the scan — it is read during the scan, so the test completes and is refused afterwards where configuration says it should be. A refusal the software cannot attribute to a condition it recognises says nothing specific. Asking the user to present the code themselves is future development (FR-KIT-009, milestone 5). The same read and check run during a practice scan without registering the kit.","ux":"Happens inside the scan screen, not as a separate step. The user has already run the assay by this point, so the failure copy must acknowledge that the kit is spent.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Adding this check to the scan practice as well","src":"pm","doc":"SPEC-03","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":5,"tbd":0},{"id":"F03.2","name":"Reuse detection and new-kit gating","fr":["FR-KIT-004","FR-KIT-007","FR-KIT-005","FR-KIT-010"],"intent":"A kit identifier already used invalidates the test at the point of scanning. Separately, starting a test within twenty-four hours of a previous one raises an alert requiring the user to confirm they hold a new kit.","ux":"Reuse is detected, not prevented, because the identifier is only read at the scan. A practice scan reads it read-only, so practising on the kit under test cannot spend it. Two very different moments: a confirmation dialogue at the start, and a dead end at the end. The confirmation is presented with a message chosen by how the previous test ended, and the window excludes its endpoint. Expiry validation from the identifier is future development (FR-KIT-005, milestone 5), so an expired kit is not currently caught, and a backend refusal on a minimum interval between tests is future development too (FR-KIT-010).","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Adding this check to the scan practice as well","src":"pm","doc":"SPEC-03","state":"ready","stateLabel":"ready","readiness":"start"},"first":3,"last":5,"tbd":0}]},{"code":"E04","title":"Guided Test Flow Engine","kind":"app","journey":"The whole physical procedure, from sample collection to scan","summary":"The application is the sole means by which a lay user is guided through a multi-stage physical procedure, so the flow engine is the core of the product. Its interface is a chat-style exchange: one step at a time, the user confirms, the next arrives, and a spoken persona reads each bubble aloud. That explains a good deal of the rest of this document — why only the current instruction is visible, why the camera permission is requested inside the flow rather than before it,. This epic covers how the guidance is structured and how it survives interruption; what it must say is E07, and when it may advance is E05.","open":["Q-29 instructional comprehension has no stated verification activity","Q-65 which steps of the flow are conditional","Q-66 which gesture reveals the demonstration skip-to-step control"],"features":[{"id":"F04.1","name":"Step sequencer and confirmation model","fr":["FR-FLW-001","FR-FLW-004","FR-FLW-005","FR-FLW-006"],"intent":"The procedure is a sequence of short discrete steps in a fixed order, each requiring the user to confirm by activating a control, with only the current step's instruction visible and no route to a step not yet permitted. Steps may be included or omitted according to a parameter resolved outside the build.","ux":"The single most important interaction pattern in the application, and it is a chat-style exchange rather than a paged wizard: one step at a time, the user confirms with a button, the next arrives. FR-FLW-006 makes steps conditional — the Date of Birth confirmation withheld from study participants is one example, the explanatory video after a result another. The full set of conditions and the chat behaviour they drive lives in the chat bubbles specification, not here.","split":[["M1","The sequence itself: discrete ordered steps, a confirmation control on each, and only the current step's instruction visible."],["M3","Making steps conditional on a parameter resolved outside the build, which is how the date-of-birth step is withheld from clinical-study participants."]],"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"the chat engine supports what we want in the QACR flow, there are no new controls or mechanics except for the timers which will be in 5.4 and the scan practice in its own spec (4.7)","src":"pm","doc":"SPEC-04","state":"ready","stateLabel":"ready","readiness":"start"},"first":1,"last":3,"tbd":0},{"id":"F04.2","name":"Instruction media, replay and spoken delivery","fr":["FR-FLW-002","FR-FLW-003","FR-FLW-008","FR-FLW-010"],"intent":"Every step carries text and a video or animation of the action required, replayable while the step is active. The flow is also read aloud, and the user can silence it.","ux":"Substantial production dependency: a video or animation per step, plus a spoken script for every bubble. Confirmed at review that not every demonstration is replayable — which are is defined per step, following the current usability application. The spoken delivery is a persona, a virtual nurse reading each bubble, with a mute control in the header; naming it is a content decision. Still needs a decision on autoplay and whether media is bundled or streamed, since a test may run on a poor connection.","split":null,"dom":["iOS","Android"],"spec":{"status":"Changed","note":"We made small changes to the video UX in QACR, this can go in this spec.","src":"pm","doc":"SPEC-04","state":"ready","stateLabel":"ready","readiness":"wait"},"first":1,"last":1,"tbd":0},{"id":"F04.3","name":"State retention and interruption tolerance","fr":["FR-STA-002","FR-STA-003","FR-STA-005","FR-STA-012"],"intent":"Test state, including all stage start times, is persisted. Calls, notifications and screen locks do not terminate the test; on return the user resumes at the active step with instructions replayable, and no inactivity timeout applies during a test.","ux":"Mostly invisible when it works. Behaves as in the existing kidney application.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-04","state":"ready","stateLabel":"ready","readiness":"start"},"first":1,"last":1,"tbd":0},{"id":"F04.4","name":"Termination detection and invalidation","fr":["FR-STA-006","FR-STA-007"],"intent":"A test cannot be resumed after the application has been terminated by any cause, including a crash or a device restart. On reopening, the incomplete test is identified, invalidated, and the user told a new kit is needed.","ux":"A harsh moment that a user may reach through no fault of their own, and the most likely source of support calls. Start from the existing kidney application and improve on it.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-04","state":"ready","stateLabel":"ready","readiness":"start"},"first":1,"last":1,"tbd":0},{"id":"F04.7","name":"Scan practice","fr":["FR-IMG-022"],"intent":"During a timed waiting period the user can start a practice scan from the flow. It behaves like the real thing — the same QCR stage, the same boundary detection, the same guidance, and from milestone 3 the same QR validation — but has no scanning-window limit, ends with the waiting period, registers no kit and produces nothing.","ux":"The point is that a user meets the scanning interaction while there is still time to struggle with it. Offered during the first timed stage, where the wait is longest. Design owes a clear distinction between practising and the real scan, so nobody believes they have already scanned.","split":null,"dom":["iOS","Android"],"spec":{"status":"New","note":"New for QACR. No Minuteful equivalent. The spec describes the practice framing; the scanning interaction is E06's.","src":"pm","doc":"SPEC-04","state":"ready","stateLabel":"ready","readiness":"wait"},"first":1,"last":1,"tbd":0},{"id":"F04.6","name":"Demonstration navigation","fr":["FR-FLW-007"],"intent":"In demonstration mode only, two controls: one advancing directly to a chosen section of the flow, one to the end of the section in progress. Both reachable by a deliberate gesture a user would not perform while taking a test, and both able to pass any timing window, since a demonstration produces no result for a patient.","ux":"Added at review for milestone 1, and made two controls at the SPEC-04 review. The gesture is to be chosen — a sustained press on the start control or a device shake were both suggested. Demonstration mode is not a separate build: at milestone 1 it may be determined in the build, and from milestone 2 it comes from the configuration set like any other configured behaviour, on the same artefact that ships to patients. Pairs with F09.4.","split":null,"dom":["iOS","Android"],"spec":{"status":"Changed","note":"the mechanism exists in minuteful, we want to add a control to jump somewhere in the flow, and not specifically to the end of it.","src":"pm","doc":"SPEC-04","state":"ready","stateLabel":"ready","readiness":"wait"},"first":1,"last":1,"tbd":0},{"id":"F04.8","name":"Waiting-time card","fr":["FR-FLW-009"],"intent":"Where a timed wait is long enough, the flow opens a card showing the time remaining and content that changes as the wait elapses. The user does not choose whether it opens; the thresholds are fixed in the application. The content is optional, and the card yields whenever the flow needs the user to act.","ux":"The requirement is the mechanism, not the content: a modal in the chat driven by elapsed time in the current stage, currently a sequence of tips. It is also where the countdown lives during a wait. Comes out of the reaction-phase research.","split":null,"dom":["iOS","Android"],"spec":{"status":"New","note":"with 5.4","src":"pm","doc":"SPEC-05","state":"ready","stateLabel":"ready","readiness":"wait"},"first":1,"last":1,"tbd":0},{"id":"F04.5","name":"Cancellation","fr":["FR-STA-008","FR-STA-009","FR-STA-010"],"intent":"Cancellation is permitted only before the Urine Collection Cup has been filled. Requested after that, the user is warned the test cannot be resumed and a new kit will be needed, and must confirm.","ux":"Two cancellation behaviours either side of one step. Where the exit affordance lives, and whether it disappears after cup fill, is a design decision.","split":null,"dom":["iOS","Android"],"spec":{"status":"Changed","note":"The cancellation cut-off is cup fill. The committed-sample point is the step confirming the Urine Collection Cup was used, not the dipping step, and the exit warning and the absence reset both move with it.","src":"pm","doc":"SPEC-04","state":"ready","stateLabel":"ready","readiness":"wait"},"first":3,"last":3,"tbd":0}]},{"code":"E05","title":"Assay Timing Control","kind":"app","journey":"Two windows inside the physical procedure","summary":"The assay is time-dependent at two stages: fluid held in the Incubation Wells until the user opens the Transfer Valve, and colour developing in the Detection Wells before the scan. The application is the only thing enforcing either window, which makes this epic safety-critical. Every value is fixed in the build and none is configurable.","open":["Q-05 incubation, release-button, colour-evolution and scanning window values — nothing in this epic is verifiable until these exist","Q-06 sample-collection to Sample Pod time limit","Q-30 elapsed time can be derived from a source the user can alter"],"features":[{"id":"F05.1","name":"Timer framework and elapsed-time derivation","fr":["FR-TIM-001","FR-TIM-002","FR-TIM-003","FR-TIM-004"],"intent":"Each timed stage has a start event, minimum duration, completion window and expiry behaviour. Start times are persisted and elapsed time is computed from them, so backgrounding or screen lock never restarts a timer.","ux":"No UI, but everything in this epic rests on it. Note that elapsed time is currently derived from a source the user can alter; the hardened time source is future development (FR-TIM-004, milestone 5).","split":null,"dom":["iOS","Android"],"spec":{"status":"New","note":"Same spec as 5.4.","src":"pm","doc":"SPEC-05","state":"ready","stateLabel":"ready","readiness":"wait"},"first":1,"last":5,"tbd":0},{"id":"F05.2","name":"Sample-freshness window","fr":["FR-TIM-006"],"intent":"Time from the user confirming sample collection to connecting the Sample Pod is measured, and exceeding the limit blocks progress.","ux":"The first place the user can lose a kit to the clock. Settled at review: timed silently in the background with no countdown shown, so that the user is not hurried.","split":null,"dom":["iOS","Android"],"spec":{"status":"Changed","note":"Exists im minutefl. The timing and test steps are changed","src":"pm","doc":"SPEC-05","state":"ready","stateLabel":"ready","readiness":"wait"},"first":3,"last":3,"tbd":0},{"id":"F05.3","name":"Incubation gate and release-button window","fr":["FR-TIM-007","FR-TIM-009"],"intent":"The coloured release button instruction appears only once both the Incubation Well residence time has elapsed and the preceding instructions have been completed, and failing to operate the button within the permitted window invalidates the test.","ux":"The critical interaction of the whole test. The user is waiting, then must act promptly. Design should treat the transition from waiting to acting as a distinct, unmissable event.","split":[["M1","The incubation gate itself: the release-button instruction withheld until the residence time has elapsed and nothing precedes it."],["M2","Invalidating the test where the release-button window is missed, and telling the user why."]],"dom":["iOS","Android"],"spec":{"status":"No spec","note":"This is just another chat-flow step. The timing mechanism is spec'ed in 5.4, as well as what happens in rainy day flow.","src":"pm","doc":"SPEC-05","state":"ready","stateLabel":"ready","readiness":"wait"},"first":1,"last":2,"tbd":0},{"id":"F05.4","name":"Colour-evolution gate and scanning window","fr":["FR-TIM-008","FR-TIM-011"],"intent":"Progress past any timed stage before its minimum time is prevented, including scanning before colour evolution is complete, and the scan is permitted only inside the validated window.","ux":"A second wait-then-act transition. Design should consider whether the two waits look the same to the user or deliberately different.","split":[["M1","The colour-evolution gate: no capture before the minimum has elapsed, and the demonstration exempt from it."],["M2","The upper bound — scanning permitted only inside the validated window, and the test invalidated where it has expired."]],"dom":["iOS","Android"],"spec":{"status":"New","note":"The spec will focus primarily on the UX within the chat during the reaction wait time. The timer constraints, the dynamic tips card, the happy and sad flow.","src":"pm","doc":"SPEC-05","state":"ready","stateLabel":"ready","readiness":"wait"},"first":1,"last":2,"tbd":0},{"id":"F05.5","name":"Timing display and expiry notification","fr":["FR-TIM-005","FR-TIM-014","FR-TIM-015","FR-COM-009","FR-COM-012","FR-COM-014"],"intent":"For each active timed stage the user sees the time until the next action is permitted and the time until the window expires. A local device notification fires when a window is about to expire, but only if the application is in the background.","ux":"Two countdowns on one screen without alarming the user. Local notifications only; backend push is deferred, so the notification must not depend on connectivity. Permission is asked for behind an explainer of our own, so a refusal at the platform prompt is not the first thing the user sees — and refusing must not stop a test, since the on-screen countdown carries the obligation either way.","split":[["M1","The on-screen display of time remaining until the next action is permitted. The completion window is enforced but not displayed."],["M3","The end-of-stage signal audible while the application is in the background, so a user who set the phone down knows the wait is over."],["M4","The local device notifications raised at the timing events that need the user, while the application is in the background, and the permission request that makes them possible."],["M5","An SMS alternative where notification permission was refused."]],"dom":["iOS","Android"],"spec":{"status":"New","note":"Same spec as 5.4. the countdown UX is not exactly like minuteful.","src":"pm","doc":"SPEC-05","state":"ready","stateLabel":"ready","readiness":"wait"},"first":1,"last":5,"tbd":0},{"id":"F05.6","name":"Timing invalidation messaging","fr":["FR-TIM-012"],"intent":"A test invalidated on timing grounds tells the user why and instructs them to repeat with a new kit.","ux":"Uses the F01.5 pattern. The reason must distinguish acted-too-early from acted-too-late.","split":null,"dom":["iOS","Android"],"spec":{"status":"Changed","note":"The invalidation mechanism in the chat flow exist in minuteful. The changes are the new additions","src":"pm","doc":"SPEC-05","state":"ready","stateLabel":"ready","readiness":"wait"},"first":2,"last":2,"tbd":0}]},{"code":"E06","title":"Scan Capture and Image Validation","kind":"app","journey":"The final action of the physical procedure","summary":"The Image Validation Transfer System is what makes a colorimetric measurement possible across a heterogeneous population of smartphone cameras. It works in two stages, and the distinction is the one thing worth carrying into a planning conversation: the QCR stage runs in real time while the user frames the board, and the algorithm pipeline runs on the captured set. Either can send the user back to scan again; only exhaustion of the scanning window invalidates the test. How each stage works is specified in the IVTS and algorithm documents rather than here. This is the largest single body of milestone-1 work.","open":["Q-09 IVTS acceptance thresholds and minimum valid frames","Q-24 whether a raw or raw-equivalent representation is used, and where normalisation happens","Q-67 the Risk Analysis trace for the specular-reflection boundary","FR-CAM-002 priority undecided, and withdrawal is now an option"],"features":[{"id":"F06.1","name":"Camera acquisition and frame set","fr":["FR-CAM-001","FR-CAM-002","FR-CAM-003","FR-CAM-004"],"intent":"Once the QCR stage accepts a frame, the remaining frames of the set defined by the IVTS specification are captured, including the torch state for each and any platform-specific frames. The specified camera adjustments are applied in response to a raised condition, the parameters used are recorded, and a camera failure mid-capture is recovered from.","ux":"Little visible UI beyond the viewfinder, but the torch firing and the exposure shifting are visible to the user and should be explained rather than surprising.","split":[["M1","Acquiring the IVTS frame set once the QCR stage has accepted a frame, with the specified torch state per frame, and recording the camera parameters that were applied."],["M3","Recovering when the camera becomes unavailable or returns an invalid frame mid-capture."],["TBD","The camera adjustments applied in response to a raised condition: white balance, exposure and tone mapping."]],"dom":["iOS","Android","Algo"],"spec":{"status":"Changed","note":"A frame set defined by the QACR IVTS specification rather than a single image, with the torch state per frame, the camera parameters recorded against each image, and recovery from a camera failure mid-capture. FR-CAM-002's priority is still undecided.","src":"derived","doc":"SPEC-06","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":1,"last":3,"tbd":1},{"id":"F06.2","name":"QCR stage","fr":["FR-IMG-001","FR-IMG-002","FR-IMG-010","FR-IMG-011"],"intent":"The real-time stage, running while the user frames the board. A frame is accepted or rejected as it is seen, and acceptance is what triggers capture of the rest of the set.","ux":"Settled at review: neither the scanning countdown nor a clock is shown, so that the user is not hurried. Design owes a way of conveying that another attempt is possible without implying time pressure. The gates are F06.3, the guidance F06.4; the detail is in the IVTS and algorithm specifications.","split":null,"dom":["iOS","Android","Algo"],"spec":{"status":"Changed","note":"same mechanism. The marker reference is embedded within the Algo and we don't need a spec for that. There is an open question whether we capture RAW images along with PNG, this will change the spec","src":"pm","doc":"SPEC-06","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":1,"last":1,"tbd":0},{"id":"F06.3","name":"QCR gates","fr":["FR-IMG-004","FR-IMG-005","FR-IMG-006","FR-IMG-007","FR-IMG-008"],"intent":"The gates applied to each frame during the QCR stage. A gate failing rejects the frame and tells the user which condition to correct. The requirements here are the gates the Risk Analysis relies on; the full set is in the IVTS specification.","ux":"Follow the existing kidney application design. Each gate needs a state the user can recognise and act on at a glance, while holding a phone over a board.","split":null,"dom":["iOS","Android","Algo"],"spec":{"status":"Changed","note":"additional QCR boundary (specularity)","src":"pm","doc":"SPEC-06","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":1,"last":1,"tbd":0},{"id":"F06.6","name":"Algorithm pipeline and IVTS boundaries","fr":["FR-IMG-009","FR-IMG-021","FR-IMG-015","FR-IMG-023"],"intent":"The captured set goes to the algorithm pipeline, which evaluates the IVTS boundary conditions. A boundary raises a message and the user may scan again; only exhaustion of the scanning window invalidates the test.","ux":"Needs a state of its own while the pipeline runs, because the delay is long enough that a viewfinder with nothing happening reads as a failure. Specularity is the one boundary with no existing treatment to copy.","split":null,"dom":["iOS","Android","Algo"],"spec":{"status":"Changed","note":"QACR IVTS boundary conditions, including the specular reflection condition added at review, plus a preparation-and-evaluation state after the frame set is captured so the user is not left on a viewfinder with nothing happening.","src":"derived","doc":"SPEC-06","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":1,"last":1,"tbd":0},{"id":"F06.4","name":"Real-time scan guidance, shown and spoken","fr":["FR-IMG-013","FR-IMG-014","FR-IMG-024"],"intent":"Guidance that runs during the QCR stage, steering the user towards a valid distance, angle and framing, and naming each condition that rejects a frame together with the correction. It is spoken as it changes, as well as shown.","ux":"The user's eyes are on the board, not the screen, which is the whole reason for the spoken channel. Needs a voice script written for interruption and repetition, not just labels.","split":null,"dom":["iOS","Android"],"spec":{"status":"Changed","note":"Adding the spoken text. This one is already 95% spec'ed and developed for the usability version","src":"pm","doc":"SPEC-06","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":1,"last":1,"tbd":0},{"id":"F06.5","name":"Colour normalisation","fr":["FR-IMG-016"],"intent":"Colours are normalised against the Color Print's standardised reference spectrum before colorimetric values are derived.","ux":"No UI. Whether it happens on the device or in the backend is still open and affects where the work sits.","split":null,"dom":["Algo"],"spec":{"status":"No spec","note":"Algo domain, no product spec is needed","src":"pm","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":1,"last":1,"tbd":0}]},{"code":"E07","title":"Instructional and Clinical Content","kind":"content","journey":"Cross-cutting — the words on every screen","summary":"What the application says, held separately from how it behaves so that instructional copy, warnings and result messaging can be drafted, read for comprehension and approved as one body of content. This is the epic with the largest dependency on people outside engineering, and the flow engine of E04 cannot be demonstrated without it.","open":["Q-18 no user-facing name for the Peel-Off Seal — instructional copy cannot be drafted without it","Q-22 whether the grade-6 reading level applies to mandated regulatory wording","Q-16 the Risk Analysis uses a component name the glossary does not define"],"features":[{"id":"F07.1","name":"Content standards and control","fr":["FR-TXT-001","FR-TXT-002","FR-TXT-003","FR-TXT-004","FR-TXT-022","FR-TXT-023"],"intent":"All user-facing text meets a Flesch-Kincaid grade-6 reading level, uses only the approved user-facing component names, does not contradict the User Manual, and is released as a versioned content set recorded with each test.","ux":"Constrains every string in the product. The versioned content set implies content is not hardcoded, which is an architecture decision as much as a content one.","split":[["M2","The grade-6 reading level and the approved component names, both of which the copy must meet before an intended user reads it unaided."],["M3","Consistency with the User Manual, release of the content as a versioned set whose version is recorded with each test, and text that scales with the device setting up to a defined maximum."],["M4","Screen-reader support on the content the software does not itself speak, without altering the conduct or the timing of a test."]],"dom":["Content"],"spec":{"status":"No spec","note":"Content governance rather than application code. Copy is authored and version-controlled in the content set.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":2,"last":4,"tbd":0},{"id":"F07.2","name":"Step instructional copy","fr":["FR-TXT-005","FR-TXT-006","FR-TXT-007","FR-TXT-008","FR-TXT-009","FR-TXT-010","FR-TXT-011","FR-TXT-012","FR-TXT-013","FR-TXT-014","FR-TXT-015","FR-TXT-016","FR-TXT-017"],"intent":"Thirteen requirements, one per physical action, in the order the user meets them: lighting, cup and lid, fill line, detaching the Sample Pod, seating it in the Mixing Cartridge, the Peel-Off Seal, flat surface, cartridge alignment, connection force, mixing, the coloured release button, shadow position, and disposal.","ux":"Each pairs with a video or animation from F04.2. The Peel-Off Seal has no approved user-facing name yet, so its copy cannot be drafted.","split":null,"dom":["Content"],"spec":{"status":"No spec","note":"Instructional copy for the QACR flow. Authored in the content set, not specified here.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":1,"last":1,"tbd":0},{"id":"F07.3","name":"Result and invalid-test copy","fr":["FR-TXT-019","FR-TXT-021"],"intent":"The results screen carries the instruction not to act on the result without a professional, an explanation of what the measurement means, and the statement that it is shared with a clinician. Invalid-test messaging states the reason category and the corrective action.","ux":"The most consequential copy in the product. Reading level and regulatory wording may conflict here.","split":[["M1","The results-screen copy: what the measurement represents, what the category means, and not acting on it without a healthcare professional."],["M3","The invalid-test copy, which cannot be written until the reason enumeration in F08.4 exists."]],"dom":["Content"],"spec":{"status":"No spec","note":"Result and invalid-test copy. Authored in the content set.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":1,"last":3,"tbd":0},{"id":"F07.4","name":"Blocking and error message content","fr":["FR-TXT-020"],"intent":"Every message shown when the application blocks an action names the condition, states the corrective action and gives support contact, without disclosing sensitive information.","ux":"The content half of the F01.5 pattern. One template plus a string set, roughly twenty-five instances across the product.","split":null,"dom":["Content"],"spec":{"status":"No spec","note":"Blocking and error copy. Authored in the content set; the conditions that raise it are specified in the spec that owns them.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":1,"last":1,"tbd":0}]},{"code":"E08","title":"Result Computation and Quality Control","kind":"backend","journey":"Between the scan and the result screen","summary":"Determining albumin, creatinine and the ratio from validated image data, and ensuring an invalid assay run never yields a reported number. Almost entirely backend and algorithm work, included here because the payload contract in F08.4 is what the application is built against, and because the invalidation reasons determine what the application can tell the user.","open":["Q-27 RA 3.8 and RA 7.36 depend solely on FR-ALG-008, whose priority is undecided","Q-40 whether FR-ALG-002 stays at milestone 3","Q-64 whether the demonstration build needs real quantitation","FR-ALG-003 and FR-ALG-008 priorities undecided"],"features":[{"id":"F08.1","name":"Quantitation","fr":["FR-ALG-001"],"intent":"Albumin concentration, creatinine concentration and the ratio are determined from validated image data using an algorithm version approved for the applicable configuration.","ux":"No UI. The application's dependency is timing: how long the user waits for this.","split":null,"dom":["Backend","Algo"],"spec":{"status":"No spec","note":"Spec'ed by algo","src":"pm","doc":null,"state":null,"stateLabel":null,"readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F08.2","name":"Algorithm version governance","fr":["FR-ALG-002","FR-ALG-003","FR-ALG-004"],"intent":"A controlled mapping between software configurations and approved algorithm versions, a check that the mobile and backend versions assigned to an exam are an approved combination, and a full record of versions, values and diagnostics per exam.","ux":"No UI. Matters to the application only in that a mismatch must surface as an invalid test rather than a crash.","split":[["M2","Recording the versions, values, raw results and diagnostics used for each exam."],["M3","The controlled mapping between supported configurations and approved algorithm versions."],["TBD","Enforcing that the mobile and backend versions assigned to an exam form an approved combination."]],"dom":["Backend"],"spec":{"status":"Changed","note":"We need to verify the status, im not sure how is it handled in minuteful","src":"pm","doc":"SPEC-08","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":2,"last":3,"tbd":1},{"id":"F08.3","name":"Assay quality control and invalidation","fr":["FR-ALG-005","FR-ALG-006","FR-ALG-007","FR-ALG-008","FR-ALG-009"],"intent":"Standard-curve quality control, recovery and blank well evaluation for interfering substances, detection of an incomplete assay run, detection that the sample never reached the buffer or that insufficient fluid reached the Detection Wells, and detection of insufficient colour output. Any failure blocks the result.","ux":"No UI, but it generates most of the invalid-test outcomes the user will actually see. Note the capability limit: out-of-sequence assay signatures cannot be detected.","split":[["M2","Detecting an incomplete assay run, and insufficient colour output in the standard curves."],["M3","Standard-curve quality control, and evaluation of the recovery and blank wells for interfering substances and discoloration."],["TBD","Detecting that the sample never reached the buffer, and that insufficient fluid reached the Detection Wells."]],"dom":["Algo"],"spec":{"status":"New","note":"the algo team handles the spec, I just want to have a place that aggregates all the requirements","src":"pm","doc":"SPEC-08","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":2,"last":3,"tbd":1},{"id":"F08.4","name":"Result payload contract","fr":["FR-ALG-010","FR-ALG-011","FR-ALG-012"],"intent":"The payload distinguishes unambiguously between a valid quantitative result and an invalid test, conveys an out-of-range condition, and carries a reason category for every invalid test drawn from a defined enumeration.","ux":"The interface the whole of E09 is built on. The enumeration should be agreed before the result screens are designed, because it sets how many distinct outcomes the user can be shown.","split":[["M2","The unambiguous valid-or-invalid distinction, and the reason category carried for every invalid test."],["M3","Conveying that a result falls outside the claimed measuring range."]],"dom":["iOS","Android","Backend","Algo"],"spec":{"status":"Changed","note":"The payload contract: a valid quantitative result distinguished unambiguously from an invalid test, an out-of-range condition conveyed for presentation, and a reason category per invalid test drawn from a defined enumeration.","src":"derived","doc":"SPEC-08","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":2,"last":3,"tbd":0}]},{"code":"E09","title":"Result Presentation","kind":"app","journey":"Immediately after the scan and upload","summary":"What the user sees when a result comes back. Small in requirement count and large in consequence: this is the moment the product exists for, and the only moment at which a patient learns something about their kidney health.","open":[],"features":[{"id":"F09.1","name":"Result display","fr":["FR-RES-001","FR-RES-002","FR-RES-003","FR-RES-007"],"intent":"The albumin-to-creatinine ratio is presented as both a number and a category, with units. The result shown is the one for the exam the application asked about, not simply the latest.","ux":"Not a screen but a display: the same component is embedded in the chat at the end of the test and again in the results center, so it has to work in both places and at both sizes. Needs the categories, their boundaries and their visual treatment. Whether a raised result looks different from a normal one, and how much, is the central design question of this epic.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Changed","note":"this will also handle out of range results","src":"pm","doc":"SPEC-09","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":1,"last":5,"tbd":0},{"id":"F09.2","name":"Out-of-range and invalid outcomes","fr":["FR-RES-004","FR-RES-005","FR-SUP-005"],"intent":"A result outside the claimed measuring range is presented as that condition rather than an unqualified number, and an invalid test shows no number at all.","ux":"Three outcomes: valid, out of range, invalid. In the existing application the first two are screens and the third an alert, which is a user-interface decision rather than a requirement. However it is presented, the invalid outcome is reached by many different routes and should say which.","split":[["M1","The invalid-test outcome, presented as an alert with no numeric value under any condition."],["M2","The out-of-range condition, presented as that condition rather than an unqualified number."],["M3","Asking, where a test is invalidated, whether the kit had already been spent on a practice or dry run."]],"dom":["iOS","Android"],"spec":{"status":"New","note":"We'll need a spec for all the different options for how the results will be displayed.","src":"pm","doc":"SPEC-09","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":1,"last":3,"tbd":0},{"id":"F09.4","name":"Demonstration result","fr":["FR-RES-006"],"intent":"In a demonstration build the result comes from a fixed payload rather than an analysed test, is not presented as a clinical result, and the demonstration state is evident on every screen showing a result.","ux":"Added at review so that milestone 1 can show a result before the payload contract exists. Demonstration mode is a backend flag rather than a separate build, so the marking is the only thing distinguishing a demonstration result from a real one — it has to be unmissable without dominating what is being demonstrated.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Changed","note":"This does exist in minuteful. There are demo-partners configurations with the mock results in them, and the backend knows to override algo results and send the mock in these partners.","src":"pm","doc":"SPEC-09","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":1,"last":1,"tbd":0}]},{"code":"E10","title":"Results Center, Main Menu and Support","kind":"app","journey":"After the test, and at any time outside a test","summary":"Everything the user reaches outside the test flow. The results center is a screen of its own holding previous results, protected by a PIN. The main menu, a hamburger on the home screen, is the route to the information an authenticated user may need at any time. Support contact belongs here too, since it is reachable both from the menu and from every blocked screen.","open":["Q-23 what the results center contains","Q-28 a user who forgets their PIN has no recovery path, since FR-ACC-003, FR-ACC-007 and FR-ACC-008 are all future development","Q-39 whether the results center can be delivered in time for milestone 3"],"features":[{"id":"F10.1","name":"PIN protection","fr":["FR-ACC-001","FR-ACC-002","FR-ACC-004","FR-ACC-005","FR-ACC-006","FR-ACC-003","FR-ACC-007","FR-ACC-008"],"intent":"Access to the results center requires a four-digit numeric PIN, prompted for if not yet set. Five failed attempts deny access and direct the user to support. If no PIN is set within twenty-four hours of test completion, setup is locked and only support can reset it.","ux":"A tight window with a hard edge. Prompting for the PIN inside the test flow, biometrics and support reset are all deferred, which means a user who does nothing for a day is locked out with no self-service route.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-10","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":4,"last":5,"tbd":0},{"id":"F10.2","name":"Results-center session control","fr":["FR-ACC-009"],"intent":"Fifteen minutes of inactivity in the results center returns the user to the home screen and requires the PIN to be entered again before re-entry.","ux":"Applies to the results center only. An active test never times out, which is a deliberate asymmetry design should preserve.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-10","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":4,"last":4,"tbd":0},{"id":"F10.3","name":"Results center main screen","fr":["FR-PRT-001","FR-PRT-007","FR-PRT-009","FR-PRT-010","FR-PRT-011","FR-PRT-014","FR-PRT-015"],"intent":"A screen of its own showing the user's most recent result and the date that test was performed. Everything beyond that is deferred: the history of earlier results, viewing and sharing the results letter, and further information about the result.","ux":"Separated at review. The results center main screen is milestone 3; the history screen of the last five results, reachable only where more than one result exists, is future development (FR-PRT-015). Two entry points: a dedicated control on the home screen, and the main menu. The results-letter and more-information entries pair with F11.4.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"behavior unchanged, UI might change a bit.","src":"pm","doc":"SPEC-10","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":3,"last":5,"tbd":0},{"id":"F10.4","name":"Main menu","fr":["FR-PRT-002","FR-PRT-003","FR-PRT-005","FR-SUP-001"],"intent":"A hamburger menu on the home screen, available outside an active test, giving access to an About screen with the regulatory information, and to the Privacy Policy and Terms in a web view. A FAQ page is deferred.","ux":"The menu's contents at milestone 3 determine its priority. Design should reserve room for the deferred entries rather than sizing it to what ships first.","split":[["M3","The menu itself, reached from the hamburger on the home screen, and the About screen carrying the regulatory information."],["M4","The Privacy Policy and Terms and Conditions in an in-application web view."],["Deferred","The Frequently Asked Questions page."]],"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-10","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":3,"last":5,"tbd":0},{"id":"F10.5","name":"Support contact","fr":["FR-SUP-002","FR-PRT-004","FR-SUP-004"],"intent":"Telephone and email support, reachable from the main menu without starting a test as well as from every blocked screen. In-application support chat is deferred.","ux":"The escape hatch for the whole product. Consider what context is carried into the call or email, since the user will not know their test identifier. Support contact is not shown on every blocking alert — only where the user cannot resolve the condition themselves.","split":null,"dom":["iOS","Android"],"spec":{"status":"Changed","note":"Currently minuteful supports in-app chat. We'll need to spec the email/telephone","src":"pm","doc":"SPEC-10","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":3,"last":5,"tbd":0},{"id":"F10.6","name":"Post-test lobby","fr":["FR-PRT-012","FR-PRT-013"],"intent":"The home screen becomes a post-test lobby after a successful test, presenting the actions defined for the result type and instrumented accordingly. Deferred in full.","ux":"Deferred, but it is the home screen, so its absence is itself a design question: what does the home screen show for the ninety days after a test in this version?","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Its differed to the backlog but we will still spec it","src":"pm","doc":"SPEC-10","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":5,"last":5,"tbd":0}]},{"code":"E11","title":"Result Routing and Sharing","kind":"backend","journey":"After the result, mostly invisible to the user","summary":"Getting the result to the right clinician, recorded against the right patient. In this version it travels through the backend and the user does nothing; every user-initiated sharing route is deferred. The application-side consequence is that the result screen has no share action in this release.","open":["Q-21 does doctor-to-patient engagement take place within the application","Q-81 screenshot prevention against saving the results letter to the photo library","FR-SHR-011 priority undecided"],"features":[{"id":"F11.1","name":"Tenancy and patient mapping","fr":["FR-SHR-001","FR-SHR-002","FR-SHR-003","FR-SHR-004"],"intent":"The data model is segmented by partnering organisation with logical isolation between providers, each patient maps to one provider organisation, each result maps to the patient record behind the verified token, and each provider has its own integration configuration.","ux":"No UI. This is the control that prevents a result reaching the wrong patient or the wrong provider. Follow the existing kidney application: either the prescription comes from our third-party prescriber, or the partner organisation provides it.","split":null,"dom":["Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-11","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F11.2","name":"Provider integration and delivery","fr":["FR-SHR-005","FR-SHR-006","FR-SHR-007","FR-SHR-008","FR-SHR-017"],"intent":"HL7-based integration with a documented per-provider mapping, handshake and acknowledgement, retry on failure, rejection of malformed transmissions and access denied to unauthorised addresses. HISP delivery to primary care providers was separated at review and is deferred.","ux":"No UI. Worth knowing that delivery failure is invisible to the user, who is told the result was shared. The prescribing model is as F11.1.","split":null,"dom":["Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-11","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":3,"last":5,"tbd":0},{"id":"F11.3","name":"Post-result journey per partner","fr":["FR-SHR-011"],"intent":"Configuration states, per partner, whether doctor-to-patient engagement happens inside the application or outside it, and the application presents the corresponding post-result journey.","ux":"This one requirement decides whether an entire branch of the product exists for a given partner. Priority undecided.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-11","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":null,"last":null,"tbd":1},{"id":"F11.4","name":"User-initiated sharing","fr":["FR-SHR-012","FR-PRT-008","FR-SHR-015","FR-SHR-016","FR-SHR-018"],"intent":"Sharing the result with a primary care provider, generating a results letter as a PDF, opening a configured web page, and handing off to an external application where a sharing action requires one. All deferred.","ux":"Deferred. The hand-off is guarded: only explicitly configured applications, only user-initiated, only the minimum data the action needs. The option set varies with what is installed — FR-SHR-018, future development, checks for a configured sharing application and presents the options that apply. Note the unresolved tension with FR-SEC-007, which prevents screenshots of result screens while one of these options saves the results letter to the photo library; see Q-81.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Its differed to the backlog but we will still spec it","src":"pm","doc":"SPEC-11","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":5,"last":5,"tbd":0},{"id":"F11.5","name":"Doctor engagement and post-test consultation","fr":["FR-SHR-013","FR-SHR-014"],"intent":"A chat with a doctor before or after a test, and calling a primary care provider or care team on a configured number. Deferred, and conditional on F11.3.","ux":"Do not design the post-result screens as though this exists until the partner question in F11.3 is settled. It is the branch that decides whether the product ends at the result or continues into a consultation.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Its differed to the backlog but we will still spec it","src":"pm","doc":"SPEC-11","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":5,"last":5,"tbd":0},{"id":"F11.6","name":"Post-test feedback survey","fr":["FR-ANL-006","FR-ANL-007","FR-ANL-008"],"intent":"A configured survey opened in an in-application web view, declinable, and unable to block or delay the result. Deferred.","ux":"Moved out of the result-presentation epic at review: the survey belongs after the consultation rather than immediately after the result, because by then the user has already seen the result. It follows F11.5 and so inherits its dependency on the partner question.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Its differed to the backlog but we will still spec it","src":"pm","doc":"SPEC-11","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":5,"last":5,"tbd":0},{"id":"F11.7","name":"Application rating prompt","fr":["FR-ANL-009"],"intent":"The operating system's own application-store rating prompt, presented at the end of the consultation flow. Deferred.","ux":"Separate from the survey because it is the platform's prompt rather than ours, and it is asked once in the lifetime of an install rather than after every test. Timing matters: it should not follow an invalid test or a raised result.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Its differed to the backlog but we will still spec it","src":"pm","doc":"SPEC-11","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":5,"last":5,"tbd":0}]},{"code":"E12","title":"Connectivity and Data Transmission","kind":"app","journey":"At the scan, and in the background afterwards","summary":"Moving the captured data to the backend and surviving the fact that a home user's connection is unreliable at exactly the wrong moment. The transport requirements also carry most of the threat-analysis controls for data in transit.","open":[],"features":[{"id":"F12.1","name":"Secure transport","fr":["FR-COM-001","FR-COM-002","FR-SEC-014"],"intent":"HTTPS over TLS 1.2 or above with strong cipher suites, chain verification and strong session identifiers, refusing anything negotiated lower, and certificate pinning so only the expected certificate is accepted. Until both are implemented, no build may carry personal or health information.","ux":"No UI. A pinning failure needs a user-facing outcome, which today falls to the generic blocked-state pattern. FR-SEC-014 was added at review to keep patient data out of the milestone-1 build.","split":[["M1","The constraint that no build in which the transport controls are unimplemented may carry personal or health information — which is what makes the demonstration build acceptable."],["M3","TLS 1.2 or above with strong cipher suites and chain verification, and certificate pinning."]],"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-12","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":1,"last":3,"tbd":0},{"id":"F12.2","name":"Upload, retrieval and integrity","fr":["FR-COM-003","FR-COM-004","FR-COM-005","FR-COM-007","FR-COM-011","FR-SEC-006"],"intent":"Captured data is transmitted with an integrity check and an upload indication; the backend treats everything received as untrusted and rejects malformed payloads; the application then requests the result and shows a waiting state until one arrives; on acknowledgement the user may conclude the test and local test data is deleted.","ux":"FR-COM-011 was added at review and closes UX-02: the waiting state between upload and result is now a requirement rather than a gap. The period after which the user is told how the result will reach them is still unvalued.","split":[["M1","Transmitting the captured data with an integrity check, the backend rejecting malformed payloads, then requesting the result and holding a waiting state until one arrives."],["M3","Concluding the test on backend acknowledgement and deleting the local test data."]],"dom":["iOS","Android","Backend"],"spec":{"status":"Changed","note":"The application now explicitly requests the result and holds a waiting state until one arrives, and the waiting period is a system parameter with no value yet. The integrity check and the backend's rejection of malformed payloads are stated.","src":"derived","doc":"SPEC-12","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":1,"last":3,"tbd":0},{"id":"F12.3","name":"Interrupted upload and retry","fr":["FR-COM-006","FR-COM-008"],"intent":"Losing connectivity mid-upload notifies the user, retains the
