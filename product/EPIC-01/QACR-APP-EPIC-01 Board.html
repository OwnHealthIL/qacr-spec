 data, retries automatically and resumes when connectivity returns. A backend error is explained with the next steps available.","ux":"The user may walk away mid-upload. Design owes the state they come back to, and how they learn a result arrived later.","split":[["M1","Explaining a backend error and the next steps available to the user."],["M3","Retaining the data on connectivity loss, retrying automatically, and resuming when connectivity returns."]],"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-12","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":1,"last":3,"tbd":0},{"id":"F12.4","name":"Push notifications","fr":["FR-COM-013"],"intent":"Receipt of push notifications from the backend. Deferred, which is why the timing notification in F05.5 is local only.","ux":"Deferred. Nothing may be designed to depend on a server-initiated message.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Its differed to the backlog but we will still spec it","src":"pm","doc":"SPEC-12","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":5,"last":5,"tbd":0}]},{"code":"E13","title":"Security and Privacy","kind":"app","journey":"Cross-cutting","summary":"Protecting personal and health information on the device and in transit. Almost all of it originates in the Security and Privacy Threat Analysis, which remains the authority for the threat model; these are the application obligations that follow from it. Little of it is visible to the user, with one prominent exception in F13.3.","open":[],"features":[{"id":"F13.1","name":"Data at rest and minimisation","fr":["FR-SEC-001","FR-SEC-009"],"intent":"Sensitive data stored on the device is encrypted and limited to what completing the test requires, and cryptographic keys and session tokens live only in the iOS Keychain or Android Keystore.","ux":"No UI.","split":null,"dom":["iOS","Android"],"spec":{"status":"No spec","note":"Security controls with no user-facing behaviour. The requirements are the specification, so this can be built from them directly.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F13.2","name":"Build hardening","fr":["FR-SEC-002","FR-SEC-003","FR-SEC-012"],"intent":"Code obfuscation on Android, all debugging functionality disabled in release builds, and encrypted release artefacts on both platforms.","ux":"No UI. Build and release pipeline work rather than feature work.","split":null,"dom":["iOS","Android"],"spec":{"status":"No spec","note":"Build hardening. As F13.1: no UX, the requirements are the specification.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F13.3","name":"Screen and preview protection","fr":["FR-SEC-007"],"intent":"Screenshots of any screen carrying personal, health or result information are prevented, and such content is obscured when the application is backgrounded so it does not appear in the app switcher.","ux":"The one security requirement the user will notice, and they will notice it at the worst moment: trying to screenshot their own result to send to someone. Worth an explicit design response.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-13","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F13.4","name":"Error hygiene and input validation","fr":["FR-SEC-004","FR-SEC-005","FR-SEC-010","FR-SEC-011"],"intent":"Error messages disclose neither personal information nor internal technical detail; logs and crash reports carry no personal or health information; and all user-supplied input is validated and sanitised against the expected type, length and character set.","ux":"Sets a floor under the copy in F07.4: no stack traces, endpoints or component versions in anything the user can see.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"No spec","note":"no spec but should be mentioned as a requirement somewhere","src":"pm","doc":null,"state":null,"stateLabel":null,"readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F13.5","name":"Security audit events","fr":["FR-SEC-013"],"intent":"Security-relevant events are reported to the backend for audit logging, including authentication attempts, PIN failures, integrity-check failures and blocked test starts, carrying no personal or health information.","ux":"No UI. A separate channel from analytics, though the same privacy constraint applies to both.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-13","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":4,"last":4,"tbd":0}]},{"code":"E14","title":"Analytics","kind":"app","journey":"Cross-cutting","summary":"Instrumentation for observing how the application is actually used in the field, subject to the constraint that it may carry no personal or health information and may never become a dependency of the clinical flow.","open":["Q-34 analytics events will reach the provider directly rather than through the proxy"],"features":[{"id":"F14.1","name":"Event instrumentation","fr":["FR-ANL-001"],"intent":"Events for progress through the test flow: step entry and completion, blocking conditions raised, scan attempts and their outcomes, and test completion or invalidation.","ux":"Mixpanel. The event taxonomy should be designed alongside the flow rather than retrofitted, since the step boundaries are the events.","split":null,"dom":["iOS","Android"],"spec":{"status":"Changed","note":"Same Mixpanel instrumentation. The event set follows the QACR flow, so the steps and the scan outcomes differ.","src":"derived","doc":"SPEC-14","state":"not written","stateLabel":"not written yet","readiness":"wait"},"first":3,"last":3,"tbd":0},{"id":"F14.2","name":"Analytics privacy constraints","fr":["FR-ANL-002","FR-ANL-003"],"intent":"No personal information, health information or result values in any event, and events tied to a pseudonymous identifier the analytics provider cannot resolve to a patient.","ux":"No UI. Constrains what any dashboard can ever show, which is worth saying out loud before dashboards are specified.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-14","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F14.3","name":"Analytics resilience","fr":["FR-ANL-005"],"intent":"Failure or unavailability of the analytics service must not prevent a test being started, completed or reported.","ux":"No UI.","split":null,"dom":["iOS","Android"],"spec":{"status":"Unchanged","note":"Recreation of Minuteful Kidney behaviour. Implementation stays as it is; the spec records it rather than redesigning it, so this can be built from the existing application.","src":"std","doc":"SPEC-14","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":3,"last":3,"tbd":0},{"id":"F14.4","name":"Proxy routing","fr":["FR-ANL-004"],"intent":"Routing events through the configured proxy endpoint rather than directly to the provider. Deferred.","ux":"Deferred, so events reach the provider directly for now; the exposure is limited to event metadata by F14.2.","split":null,"dom":["iOS","Android","Backend"],"spec":{"status":"Unchanged","note":"Its differed to the backlog but we will still spec it","src":"pm","doc":"SPEC-14","state":"not written","stateLabel":"not written yet","readiness":"start"},"first":5,"last":5,"tbd":0}]},{"code":"E15","title":"Verification and Release Process","kind":"process","journey":"Not user-facing","summary":"Risk controls implemented through how the software is built, tested and released rather than through anything the application does. Not feature work, and not a backlog either — each item is relied upon by the Risk Analysis and needs an owner. Development standards including unit testing sit in the Software Development Plan, not here.","open":["Q-29 instructional comprehension has no stated verification activity in this document"],"features":[{"id":"F15.1","name":"System parameter control","fr":["FR-LCM-006"],"intent":"Every system parameter has a value, permitted range and documented rationale before design verification, held under configuration control whether fixed in the build or supplied by configuration.","ux":"This is the gate the open parameter values in the register must pass through.","split":null,"dom":["Process"],"spec":{"status":"No spec","note":"A process control applied to the product rather than behaviour built into it.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":3,"last":3,"tbd":0},{"id":"F15.2","name":"Timing and state verification","fr":["FR-LCM-007","FR-LCM-008","FR-LCM-011"],"intent":"Each timer and timing window verified separately including under backgrounding and interruption; regression testing of the timing and state controls each release; and verification of state retention, termination and reopening at every stage of the flow.","ux":"The verification counterpart to E04 and E05. Test design should start when those epics do, not after.","split":[["M3","Verifying each timer and window separately including under backgrounding and interruption, and verifying state retention, termination and reopening at every stage of the flow."],["M4","Regression testing the timing and test-state controls at each applicable release."]],"dom":["Process"],"spec":{"status":"No spec","note":"A verification activity, not application behaviour.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":3,"last":4,"tbd":0},{"id":"F15.3","name":"Algorithm and release verification","fr":["FR-LCM-009","FR-LCM-010","FR-LCM-017"],"intent":"Verification and validation of each algorithm version and approved version combination, with regression against a validated reference algorithm where a full analytical study is not repeated; confirmation that approved versions and configuration reached production; and release testing before each release.","ux":"Counterpart to E08.","split":null,"dom":["Process"],"spec":{"status":"No spec","note":"A verification activity covering the algorithm and the release.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":3,"last":3,"tbd":0},{"id":"F15.4","name":"Off-the-shelf component management","fr":["FR-LCM-002","FR-LCM-003","FR-LCM-004","FR-LCM-005"],"intent":"Third-party components evaluated before integration and obtained only from official sources, validated within the whole system before release, inventoried continuously by a scanning tool, and monitored for vulnerabilities and supplier notifications with changes assessed through change control.","ux":"Tooling and subscription decisions, including the vulnerability bulletins the threat analysis names.","split":null,"dom":["Process"],"spec":{"status":"No spec","note":"Off-the-shelf component management. A process obligation.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":3,"last":3,"tbd":0},{"id":"F15.5","name":"Usability testing","fr":["FR-LCM-012"],"intent":"Usability testing includes representatives of each supported platform and evaluates foreseeable interruptions before, during and after result-critical actions.","ux":"The milestone-2 usability rehearsal is where this begins. Note that comprehension of the instructions has no stated verification activity here and is assumed to sit in the Usability Engineering Plan.","split":null,"dom":["Process"],"spec":{"status":"No spec","note":"Usability testing. A study, not code.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":3,"last":3,"tbd":0},{"id":"F15.6","name":"Provider integration testing","fr":["FR-LCM-016"],"intent":"A dedicated integration testing phase with each medical provider before go-live, covering connectivity, transmission and mapping accuracy, routing and the handling of failures.","ux":"Per provider organisation, so it repeats for each partner.","split":null,"dom":["Process"],"spec":{"status":"No spec","note":"Provider integration testing. A verification activity.","src":"derived","doc":null,"state":null,"stateLabel":null,"readiness":"other"},"first":4,"last":4,"tbd":0}]}],"req":{"FR-PLT-001":{"m":"4","t":"The software shall be distributed exclusively through the Apple App Store and Google Play Store.","src":"RA 4.15","note":"","sec":"4 Platform, Distribution and Compatibility"},"FR-PLT-002":{"m":"3","t":"The software shall be compatible with, and installable on, Apple iOS from the minimum version established by the IVTS device qualification.","src":"SRS LOC.1","note":"Minimum version TBD, to follow from the IVTS device qualification. iosMinOsVersion currently 13.0.0","sec":"4 Platform, Distribution and Compatibility"},"FR-PLT-003":{"m":"3","t":"The software shall be compatible with, and installable on, Android OS from the minimum version established by the IVTS device qualification.","src":"SRS LOC.2","note":"Minimum version TBD, to follow from the IVTS device qualification. androidMinOsVersion currently 8.0.0","sec":"4 Platform, Distribution and Compatibility"},"FR-PLT-004":{"m":"3","t":"The software shall be published to the application stores with hardware and operating-system compatibility filters enabled, so that installation is prevented on device models that are not supported.","src":"RA 4.5","note":"","sec":"4 Platform, Distribution and Compatibility"},"FR-PLT-005":{"m":"3","t":"The software shall maintain a backend-configurable list of supported operating-system versions and minimum hardware characteristics.","src":"RA 4.5, 4.8","note":"Narrowed per review: the Risk Analysis calls for hardware characteristics and operating systems, not a list of unsupported phone models. Model-level exclusion remains available through the store compatibility filters in FR-PLT-004","sec":"4 Platform, Distribution and Compatibility"},"FR-PLT-006":{"m":"2","t":"The iOS and Android implementations shall present functionally equivalent instructional content, step sequence, confirmation behaviour and error handling, so that the user experience is consistent across supported platforms.","src":"RA 4.7","note":"","sec":"4 Platform, Distribution and Compatibility"},"FR-PLT-008":{"m":"3","t":"The software shall record the smartphone model, operating-system version and application version in the test record transmitted to the backend.","src":"RA 4.7, 4.8, 4.22","note":"Required for IVTS and post-market analysis","sec":"4 Platform, Distribution and Compatibility"},"FR-RDY-001":{"m":"3","t":"Upon start-up, the software shall verify device integrity (root detection on Android, jailbreak detection on iOS). If a compromised device is detected, the software shall block access and prevent further use.","src":"SRS STM.1; SPTA 4.11","note":"","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-002":{"m":"3","t":"Prior to test initiation, the software shall programmatically verify that the smartphone hardware characteristics meet the defined minimum technical specifications. The user shall not be permitted to start a test if the requirements are not met.","src":"RA 4.5","note":"Specification derived from the analytical studies. Realised by staticData.supportedHardwareConfig","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-003":{"m":"3","t":"The software shall verify that the operating-system version is within the supported range. If the version is outside that range, the software shall prevent further use and display an explanatory message.","src":"RA 4.6; SPTA 2.5; SRS STM.4, STM.5; SRS-BE COM.2","note":"Range TBD. The lower bound is constrained twice: by the IVTS device qualification, and by SPTA 2.5, which requires that versions no longer receiving security updates cannot be used to take a test. The binding constraint is whichever is higher. Also validated server-side per SRS-BE COM.2","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-004":{"m":"3","t":"The software shall verify its own version against the backend. If the application version is unsupported, the software shall prevent further use and shall direct the user to the application's listing in the store from which it was installed. Whether an available update is mandatory or may be dismissed shall be determined by configuration.","src":"RA 4.17; SRS STM.4, STM.5; SRS-BE COM.2, COM.4","note":"The backend independently validates device type, operating-system version and application version on the settings request and returns a failure response, so the check is enforced on both sides. Realised by iosMinAppVersion, androidMinAppVersion, forceUpdateOnPreLogin","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-005":{"m":"3","t":"The software shall verify that the smartphone has an active internet connection. If no connection is available, the software shall prevent the test from starting and display an explanatory message.","src":"RA 5.2","note":"","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-006":{"m":"3","t":"The software shall verify that the backend server is reachable. If the backend cannot be reached, the software shall prevent the test from starting and display an explanatory message.","src":"RA 5.3; SRS STM.2","note":"","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-007":{"m":"3","t":"The software shall verify that the battery level is at or above the defined minimum threshold. If the battery level is below the threshold, the software shall prevent the test from starting and instruct the user to charge the device.","src":"RA 4.13; SRS STM.3","note":"Threshold TBD; fixed in the application, not configurable","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-008":{"m":"3","t":"The software shall verify that available storage is at or above the defined minimum threshold. If storage is insufficient, the software shall prevent the test from starting and instruct the user to free storage.","src":"RA 4.14; SRS STM.6, STM.7","note":"Threshold TBD, and fixed in the application rather than configuration-supplied. Unlinked from staticData.lowDiskSpaceSize at review","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-009":{"m":"1","t":"The software shall verify that the camera is present, and shall request camera permission at the point in the instructional flow where it is required. If the camera is absent, if permission is not granted, or if the camera cannot be started, the software shall not permit the user to proceed.","src":"RA 4.9","note":"Restated at review. Unlike the other checks in this section, the camera permission is requested inside the instructional flow at the point of need rather than silently before the test starts, so the user understands why it is being asked. Refusal blocks progress rather than warning","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-010":{"m":"3","t":"The software shall re-evaluate all readiness checks immediately before test initiation, and not only at application start-up.","src":"RA 4.5, 4.13, 4.14","note":"","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-011":{"m":"3","t":"When a readiness check fails, the software shall present a single message that identifies the condition and states the corrective action required, together with support contact information. Each condition shall be defined as either preventing the test from starting, or informing the user and permitting them to continue.","src":"RA 4.15, 4.16","note":"Content per FR-TXT-020","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-013":{"m":"3","t":"Where a condition that blocks the user can be resolved by attempting the action again, the software shall offer the user a means of retrying it. Where the condition cannot be resolved by retrying, the software shall not offer a retry, and shall present only the route to resolution that applies.","src":"Review comment; extends RA 4.15, 4.16","note":"Added at review. The distinction matters because a retry offered on an unrecoverable condition invites the user to repeat an action that cannot succeed. Whether a given condition is retryable is to be stated for each blocking condition in this document before design verification","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-014":{"m":"3","t":"Where the backend refuses to permit a test, the software shall present a message specific to the reason given, identifying the condition and the action available to the user.","src":"Review comment; QACR-APP-SPEC-01","note":"Added at review. The backend answers the start-up exchange with at most one reason why this user may not test, and each reason needs its own message rather than a generic failure. The reasons themselves are the backend contract and are not enumerated here; Appendix I records the set the current product raises. Complements FR-CFG-006, which requires a reason to be given without saying what the reasons are","sec":"5 Pre-Test Readiness Verification"},"FR-RDY-012":{"m":"3","t":"Upon start-up, the software shall determine whether previously collected test data was successfully transmitted to the backend and, if not, shall attempt to retransmit it.","src":"SRS STM.8; RA 5.2, 5.3","note":"RA trace added per review","sec":"5 Pre-Test Readiness Verification"},"FR-AUT-001":{"m":"3","t":"The software shall enable the user to initiate the authentication process by entering a phone number.","src":"SRS AUT.1","note":"","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-002":{"m":"3","t":"The software shall validate the phone-number format and prevent the entry of invalid or special characters.","src":"SRS AUT.2","note":"","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-003":{"m":"3","t":"The software shall transmit the phone number to the backend to determine whether it is already registered in the system. Where the backend does not respond, the software shall not present the number as unregistered.","src":"SRS AUT.3","note":"Realised by allowCreation (false for this app)","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-004":{"m":"3","t":"The software shall complete one-time password (OTP) verification by enabling the user to submit a six-digit OTP delivered by SMS from the backend.","src":"SRS AUT.4; RA 4.16","note":"Length is six digits, taken from the existing kidney application; confirm before design verification","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-018":{"m":"3","t":"The software shall enable the user to request that the one-time password be sent again. Each such request shall count against the attempt limit of FR-AUT-005, and the software shall require a defined interval to elapse before a further request can be made.","src":"Review comment; SRS AUT.5","note":"Added at review. The interval is 30 seconds. Resending counts against the attempt limit, so the limit governs requests and submissions together","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-019":{"m":"3","t":"While awaiting a one-time password, the software shall enable the user to return to phone-number entry in order to correct the number, and shall discard the pending verification when they do.","src":"Review comment","note":"Added at review, for the case where the user mistyped the number","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-005":{"m":"4","t":"The software shall validate the submitted OTP against the defined attempt-count and expiration limits. Where the attempt limit is reached, the phone verification process shall be locked for the defined lockout period.","src":"SRS AUT.5; SRS-BE AUT.4, AUT.5, AUT.6","note":"Values set by the backend SRS: OTP expires after 5 minutes, and 5 consecutive failures lock verification for 15 minutes. Enforced server-side. Resolves the parameter formerly open as O-04","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-006":{"m":"4","t":"If the phone number is not registered, the software shall require the user to enter an invite code, which the backend shall validate for both authenticity and expiry.","src":"SRS AUT.6; SRS-BE AUT.10, AUT.11, AUT.12","note":"Expiry validation added from the backend SRS. Realised by allowRegistration (true)","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-008":{"m":"3","t":"The software shall validate that the entered Date of Birth meets the required format.","src":"SRS AUT.8","note":"Applies to the Date of Birth confirmed at the start of a test per FR-AUT-012, not to login. Milestone follows FR-AUT-012","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-010":{"m":"3","t":"If the Date of Birth confirmed at the start of a test is mismatched or invalid, the software shall prevent the user from proceeding and shall present a generic error that does not disclose which element of the identification was at fault.","src":"SRS AUT.10; SRS-BE AUT.15; RA 6.4; SPTA 1.3","note":"Restated at review: the Date of Birth is no longer requested at login, so this governs the confirmation required by FR-AUT-012. Everything required for the submission is required for the clinical study, so milestone 3, held behind a feature flag so that the behaviour is present and verifiable without being shown to study participants. The error is generic, per the backend SRS and SPTA 1.3","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-012":{"m":"3","t":"The software shall require the user to confirm their Date of Birth at the start of every test, independently of the login flow and irrespective of how many users are registered against the phone number.","src":"RA 6.4","note":"Everything required for the submission is required for the clinical study, so milestone 3. Held behind a feature flag so that the behaviour is present and verifiable without being shown to study participants. Realised by dobVerification (force)","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-013":{"m":"3","t":"Upon successful verification, the software shall obtain a user token and shall associate that token with every subsequent request sent to the backend. The token shall expire after the defined period, after which the software shall require re-verification.","src":"RA 6.4; SRS-BE EX.3, AUT.8; SPTA 1.4, 6.1","note":"The backend SRS states 24 hours. Flagged at review as incorrect for this application and to be aligned; see the review register. Server-side verification of the token is required by FR-COM-010","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-014":{"m":"3","t":"The software shall enable the user to sign out. After sign-out, the software shall require the user to complete the verification process again before further use.","src":"SRS AUT.12; RA 6.4","note":"","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-016":{"m":"3","t":"The software shall guide the user through each authentication step and, on repeated failure, shall present support contact information.","src":"RA 4.16","note":"","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-017":{"m":"4","t":"On first launch, before the authentication process begins, the software shall present a short introductory sequence of no more than three screens introducing the application and the test, which the user may advance through or dismiss.","src":"Review comment","note":"Added at review. Content is part of the versioned set required by FR-TXT-004 and is subject to the reading level of FR-TXT-001. Distinct from the pre-test orientation raised as UX-08, which concerns what the user is told immediately before a test rather than on first launch","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-007":{"m":"5","t":"Where the phone number and invite code do not uniquely identify a single registered user, the software shall request the Date of Birth in order to identify which registered user is signing in.","src":"SRS AUT.7, AUT.9, AUT.11; RA 6.4; formerly BL-20, restored to its original identifier","note":"Future development, formerly BL-20. Reconciled at review: RA 6.4 retains FR-AUT-010, FR-AUT-012, FR-AUT-013, FR-AUT-014 and FR-SHR-003 in the body, all at milestone 3. FR-AUT-009 is withdrawn.","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-011":{"m":"5","t":"The software shall permit more than one user to be associated with the same phone number, each uniquely identified by their Date of Birth.","src":"SRS AUT.11; formerly BL-21, restored to its original identifier","note":"Future development, formerly BL-21. Household use on a shared phone number is therefore not supported until this is implemented. Confirmed at review that appUniqueIdentifier is to remain as configured today; see review register Q-10.","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-015":{"m":"5","t":"Where a test has been completed and more than one user is registered against the phone number, the software shall offer a 'switch user' function before a new test is started, which terminates the current session and returns the user to the authentication flow.","src":"SRS TSM.41; formerly BL-22, restored to its original identifier","note":"Future development, formerly BL-22. With FR-AUT-011, which it depends upon.","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-020":{"m":"5","t":"If a shared phone number is used to attempt a second test, the software shall prevent test initiation and prompt the user either to switch user or to contact support to obtain a new kit.","src":"SRS TSM.41; formerly BL-04","note":"Future development, formerly BL-04. Interacts with FR-AUT-015 and FR-KIT-004.","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-021":{"m":"3","t":"Where test data has not yet been successfully transmitted to the backend, the software shall not complete a sign-out, and shall inform the user that the transmission must finish first.","src":"Review comment; QACR-APP-SPEC-02","note":"Added at review. Signing out before the data has reached the backend discards the test irrecoverably. Complements FR-RDY-012, which retransmits data that did not arrive","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-022":{"m":"3","t":"Where the backend holds no identity for the authenticated user, the software shall require the user to complete the verification process again.","src":"Review comment; QACR-APP-SPEC-02","note":"Added at review. FR-AUT-013 requires re-verification when the token expires; this is a different trigger with the same outcome and nothing covered it","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-024":{"m":"4","t":"The software shall accept a one-time password entered automatically by the platform.","src":"Review comment; QACR-APP-SPEC-02","note":"Added at review. Both platforms","sec":"6 User Onboarding, Identification and Authentication"},"FR-AUT-023":{"m":"5","t":"At phone-number entry, where the platform provides a means of offering the phone numbers held by the device, the software shall present it.","src":"Review comment; QACR-APP-SPEC-02","note":"Added at review, future development. Available on Android only. The step, its content and its outcome are identical on both platforms, so FR-PLT-006 is unaffected","sec":"6 User Onboarding, Identification and Authentication"},"FR-CNS-001":{"m":"4","t":"The software shall allow the user to view the Privacy Policy and the Terms and Conditions from the phone verification screen and from the main menu.","src":"SRS CON.1","note":"Realised by staticData.privacyUrl, staticData.termsUrl, consentUrl. Milestone rationale as FR-CNS-002","sec":"7 Consent and Privacy Acknowledgement"},"FR-CNS-002":{"m":"4","t":"Upon entering the phone number, the software shall require the user to explicitly acknowledge acceptance of the Privacy Policy and Terms and Conditions by means of a mandatory checkbox.","src":"SRS CON.2","note":"Retained at milestone 4 by product decision: users do not go through phone verification at milestone 3, so no personal information is collected before the acknowledgement gate exists. See the decision log","sec":"7 Consent and Privacy Acknowledgement"},"FR-CNS-003":{"m":"4","t":"If the user does not select a mandatory acknowledgement checkbox, the software shall prevent the user from proceeding with the requested action.","src":"SRS CON.4","note":"Milestone rationale as FR-CNS-002","sec":"7 Consent and Privacy Acknowledgement"},"FR-CNS-005":{"m":"5","t":"Prior to initiating a chat with a doctor, the software shall require the user to explicitly acknowledge acceptance of the Privacy Policy and Terms and Conditions by means of a mandatory checkbox.","src":"SRS CON.3; formerly BL-01","note":"Future development, formerly BL-01. Depends on FR-SHR-013.","sec":"7 Consent and Privacy Acknowledgement"},"FR-CNS-006":{"m":"5","t":"When the user elects to share test results with their primary care provider, the software shall present an additional acknowledgement prompt confirming acceptance of the Privacy Policy and Terms and Conditions.","src":"SRS CON.5; formerly BL-02","note":"Future development, formerly BL-02. Depends on FR-SHR-012.","sec":"7 Consent and Privacy Acknowledgement"},"FR-CNS-007":{"m":"5","t":"The software shall record, and transmit to the backend, the identity and version of each policy document acknowledged, together with the time of acknowledgement.","src":"SRS-BE CON.1, CON.2; formerly BL-03","note":"Future development, formerly BL-03. Confirmed at review as future development. The backend SRS makes consent recording mandatory before a test starts as SRS-BE CON.1, so that document is to be relaxed to match; see review register Q-11.","sec":"7 Consent and Privacy Acknowledgement"},"FR-KIT-001":{"m":"3","t":"The software shall verify the presence of the QR code on the Test Board. If the QR code is missing or damaged, the software shall prevent the user from completing a scan, display an explanatory error message, and instruct the user to contact support.","src":"SRS TSM.2, TSM.3; RA 4.19","note":"Realised by enabledNoQrBlock, featureFlags.qrDetectionUsingMLPackage","sec":"8 Kit Identification and Validation"},"FR-KIT-002":{"m":"3","t":"The software shall capture the QR code and transmit it to the backend to verify that the kit identifier is valid and that the kit has not previously been used. The backend shall maintain the record of used kit identifiers against which that check is made.","src":"SRS TSM.4; SRS-BE COM.8, COM.9, TSM.1; RA 7.1","note":"Register of used identifiers added from the backend SRS","sec":"8 Kit Identification and Validation"},"FR-KIT-003":{"m":"3","t":"The software shall validate the QR-code content against the defined kit-identifier template, and shall not return a test result unless a valid QR code has been read.","src":"RA 4.19","note":"","sec":"8 Kit Identification and Validation"},"FR-KIT-004":{"m":"3","t":"If the QR code is unidentified, or the kit identifier has already been used, the software shall invalidate the test at the point of scanning and display an explanatory error message. A second use of the same kit cannot be prevented before the assay has been run.","src":"SRS TSM.5, TSM.40; RA 7.1","note":"Revised per review: reuse is detected at scan rather than prevented up front, because the kit identifier is only read during the scan. RA 7.1 states the control as the same kit not being re-usable, which now means detected and blocked from producing a result. Also covers FR-KIT-006. Realised by enabledQrBlock and blockSubsequentTests.moreTestsThanKits","sec":"8 Kit Identification and Validation"},"FR-KIT-007":{"m":"3","t":"Where the user attempts to start a test within 24 hours after a previous test has completed, whether that test produced a result or was invalidated, the software shall present a message appropriate to the outcome of that previous test and shall require the user to confirm that they hold a new kit before the test flow begins. The message shall be presented on every such attempt until the user confirms it.","src":"RA 7.1","note":"Window confirmed at 24 hours and held as a configurable value. The window excludes its endpoint: an attempt at exactly 24 hours is not within it. Amended at the SPEC-04 review so that the message is presented on every attempt until it is confirmed rather than once. Guy also offered that the window may close on confirmation; that is deliberately not required here, because SPEC-03 settled that one acknowledgement stands until the next test completes, and the two end conditions differ with no observable difference to the user. Amended at the SPEC-03 review, which established that the product presents a different message according to whether the previous test produced a result or was invalidated, and that a single alert stating that a new kit is required does not describe it. Which cases exist is the product's, not this requirement's. Complements FR-KIT-004, which detects reuse of an already-used kit only at the point of scanning","sec":"8 Kit Identification and Validation"},"FR-KIT-005":{"m":"5","t":"The software shall automatically verify, from the kit identifier, that the kit is within its valid use period. If the kit has expired, the software shall prevent the test from proceeding and instruct the user to use a new kit.","src":"Product requirement; formerly BL-23, restored to its original identifier","note":"Future development, formerly BL-23. RA 7.25 has been removed from the Risk Analysis, and it was confirmed at review that the backend obligation follows the Risk Analysis, so SRS-BE TSM.2 and TSM.3 are to be relaxed to match; see review register Q-12. Realised by expiredKitDetection.","sec":"8 Kit Identification and Validation"},"FR-KIT-008":{"m":"3","t":"Where the kit-identifier check is refused for a reason the software cannot attribute to a condition it recognises, the software shall invalidate the test and shall present a message that does not state a specific reason.","src":"Product requirement; SPEC-03","note":"Added at the SPEC-03 review. FR-ALG-012 does this job for an invalid test and FR-RDY-014 for a refusal before a test starts; the kit-identifier check had no equivalent, and the product asserts an already-used kit for any refusal it cannot classify, which may be untrue and routes the user to the wrong support conversation. The reasons themselves are the backend contract and are not enumerated here","sec":"8 Kit Identification and Validation"},"FR-KIT-009":{"m":"5","t":"Where the software cannot read the kit identifier automatically, it shall offer the user the means to present the QR code for reading, and shall invalidate the test only once that has also failed.","src":"Product requirement; SPEC-03","note":"Future development. Added at the SPEC-03 review as a requirement of its own so that the automatic reading of FR-KIT-001 stays at milestone 3 and the manual route does not. Until this is implemented the automatic reads are the only ones, and a test with no readable identifier is invalidated after the scan","sec":"8 Kit Identification and Validation"},"FR-KIT-010":{"m":"5","t":"The backend shall be able to refuse a test attempted within a defined minimum interval of a previous test, and the software shall present the refusal.","src":"Product requirement; SPEC-03","note":"Future development. Distinct from FR-KIT-007, which asks the user to confirm and permits them to continue: this refuses outright. Added at the SPEC-03 review so that a capability the backend already has is in the record rather than reached by configuration alone","sec":"8 Kit Identification and Validation"},"FR-FLW-001":{"m":"1","t":"The software shall present the test procedure as a sequence of short, discrete steps, each requiring the user to confirm completion by activating a control provided for that purpose, and shall not advance to the next step without that confirmation.","src":"RA 4.1, 4.2","note":"The flow is presented as a chat-style exchange, one step at a time, which is the design decision behind the single-step visibility required by FR-FLW-004. How a blocking condition is presented is a user-interface decision and is not specified here","sec":"9 Guided Test Flow — Structure and Behaviour"},"FR-FLW-002":{"m":"1","t":"The software shall present, for each step, both textual guidance and a video or animated demonstration of the required action.","src":"SRS TSM.1; RA 4.1","note":"","sec":"9 Guided Test Flow — Structure and Behaviour"},"FR-FLW-003":{"m":"1","t":"Where the demonstration for a step is designated replayable, the software shall allow the instructions and demonstration for that step to be replayed at any time while the step is active.","src":"RA 4.1, 4.2","note":"Which steps are replayable is defined per step in the content set of FR-TXT-004. Confirmed at review that not every demonstration is replayable, following the current usability application","sec":"9 Guided Test Flow — Structure and Behaviour"},"FR-FLW-004":{"m":"1","t":"The software shall display only the instruction applicable to the current step, and shall not present instructions for steps that are not yet permitted. The instructions of completed steps shall remain available to the user while the flow continues, and the view shall follow each element of the flow as it is presented.","src":"RA 4.3","note":"","sec":"9 Guided Test Flow — Structure and Behaviour"},"FR-FLW-005":{"m":"1","t":"The software shall sequence the steps of the instructional flow in the order defined by the test procedure, and shall not permit a step to be reached out of that order.","src":"RA 4.1, 4.2","note":"","sec":"9 Guided Test Flow — Structure and Behaviour"},"FR-FLW-007":{"m":"1","t":"Where the application is in demonstration mode, it shall provide a means of advancing directly to a chosen section of the guided flow, and a means of advancing to the end of the section in progress. Those means may advance past anything the flow presents, including confirmation steps and time-dependent stages, and shall be reachable only by a deliberate gesture that a user would not perform in the course of taking a test, and not at all when the application is not in demonstration mode.","src":"Review comment","note":"Added at review for the milestone-1 demonstration. The gesture is to be specified; a sustained press on the start control or a device shake were the two suggested. At milestone 1 demonstration mode may be determined in the build; from milestone 2 it is determined by the configuration set of FR-CFG-001, which by then carries a real test partner as well. Complements FR-RES-006, which governs what may be presented as a result in that mode","sec":"9 Guided Test Flow — Structure and Behaviour"},"FR-FLW-009":{"m":"1","t":"Where a timed waiting period is long enough, the software shall present within the instructional flow a card that displays the time remaining and whose content changes as the period elapses. The thresholds determining whether the card is presented shall be fixed in the application. Its content shall be optional, in that not reading it can affect neither the conduct nor the validity of the test, and the card shall yield whenever the flow requires the user to act.","src":"Review comment; supports RA 4.18","note":"The mechanism is what is required: a modal within the chat, opened by the flow rather than by the user, whose content is a function of elapsed time in the current stage. The content itself, currently tips presented in sequence, is part of the approved content set under FR-TXT-004 and can change without changing this requirement","sec":"9 Guided Test Flow — Structure and Behaviour"},"FR-FLW-008":{"m":"1","t":"The software shall present the content of the instructional flow in spoken form as well as on screen, using recorded audio rather than synthesised speech, and shall provide a control by which the user can silence and restore it. Where the user silences it, the flow shall remain silent for the remainder of that test. The spoken flow and any demonstration in progress shall stop when the user confirms a step or the application ceases to be in the foreground, and neither shall resume without the user acting.","src":"Review comment; amended at the SPEC-04 review","note":"The spoken voice is a persona; naming it is a content decision under FR-TXT-004. Because the audio is recorded rather than generated from the displayed text, the spoken and written wording are separate artefacts that have to be released together, which is why FR-TXT-004 covers both. A further language means new recordings, not only new text","sec":"9 Guided Test Flow — Structure and Behaviour"},"FR-FLW-006":{"m":"3","t":"The software shall include or omit defined steps and sections of the guided flow according to a parameter resolved outside the application build, so that behaviour which is required to exist need not be presented to every user, and shall apply the same sequencing and confirmation rules to the steps that remain.","src":"Review comment; supports the milestone-3 placement of FR-AUT-010 and FR-AUT-012","note":"Added at review. This is the mechanism by which any step is made conditional; the Date of Birth confirmation withheld from clinical-study participants is one example, the explanatory video after a result another. The full set of conditions and the chat behaviour they drive is held in the chat bubbles specification, and the steps and governing parameters are to be listed before design verification","sec":"9 Guided Test Flow — Structure and Behaviour"},"FR-FLW-010":{"m":"1","t":"Each element of the instructional flow shall be presented after a defined interval, and where an element is accompanied by recorded audio that interval shall be the duration of that audio. The intervals shall be the same on every platform.","src":"SPEC-04 review","note":"The pace of the flow is most of what a user experiences during a waiting stage, and nothing previously stated it, so each platform held whatever value it happened to hold. The interval belongs to the flow engine and applies whatever the content is, which is why it is stated here rather than deferred to the content set of FR-TXT-004. It is also what makes a permission prompt follow the explanation of it rather than a fixed delay","sec":"9 Guided Test Flow — Structure and Behaviour"},"FR-TXT-001":{"m":"2","t":"All user-facing text presented by the software, including component names, instructions, warnings, result descriptions and error messages, shall meet a Flesch-Kincaid reading level of grade 6 or lower.","src":"Glossary — Global Naming and Readability Rules","note":"Applies to every supported language","sec":"10 User-Facing Content"},"FR-TXT-002":{"m":"2","t":"The software shall refer to kit components using only the approved user-facing component names defined in the Product Glossary, and shall not present internal or engineering sub-component names to the user.","src":"Glossary — Global Naming and Readability Rules","note":"User-facing set: Sample Collection Tool, Urine Collection Cup, Sample Pod, Mixing Cartridge, Test Board, coloured release button","sec":"10 User-Facing Content"},"FR-TXT-003":{"m":"3","t":"The instructional content, warnings and result messaging presented by the software shall be consistent with the User Manual, and shall not instruct the user to act in a manner the User Manual contradicts.","src":"RA 4.7; derived","note":"","sec":"10 User-Facing Content"},"FR-TXT-004":{"m":"3","t":"All user-facing content that is part of the core clinical test procedure, including the recorded audio of the spoken flow, shall be held under configuration control and released as a versioned content set, and the content-set version shall be recorded with each test record.","src":"RA 4.7; derived","note":"Written text and recorded audio are separate artefacts that say the same thing. Holding them in one versioned set is what stops the spoken and the displayed wording drifting apart between releases","sec":"10 User-Facing Content"},"FR-TXT-005":{"m":"1","t":"The instructional flow shall direct the user to perform the test in a well-lit indoor location, avoiding direct sunlight, very dim lighting and uneven or mixed lighting.","src":"RA 7.11","note":"","sec":"10 User-Facing Content"},"FR-TXT-006":{"m":"1","t":"The instructional flow shall instruct the user in the correct use of the Urine Collection Cup lid and in placing the cup in its designated location in the kit packaging.","src":"RA 7.4","note":"","sec":"10 User-Facing Content"},"FR-TXT-007":{"m":"1","t":"The instructional flow shall guide the user to fill the Urine Collection Cup to or above the minimum fill line, and shall require the user to confirm that the fill line has been reached.","src":"RA 1.1, 7.3","note":"","sec":"10 User-Facing Content"},"FR-TXT-008":{"m":"1","t":"The instructional flow shall guide the user through detaching the Sample Pod from the Urine Collection Cup, including the twist-and-pull motion required, and shall include a confirmation step.","src":"RA 7.6, 7.22","note":"","sec":"10 User-Facing Content"},"FR-TXT-009":{"m":"1","t":"The instructional flow shall guide the user through inserting the Sample Pod into the Sample Tank port of the Mixing Cartridge, showing the correct port and orientation, and shall instruct the user to insert it until the audible or tactile confirmation is obtained.","src":"RA 7.7, 7.8, 7.26","note":"","sec":"10 User-Facing Content"},"FR-TXT-010":{"m":"1","t":"The instructional flow shall instruct the user to remove the Peel-Off Seal from the Mixing Cartridge completely before connecting the cartridge to the Test Board, and shall require the user to confirm that it has been fully removed.","src":"RA 2.7; Glossary","note":"User-facing name TBD; see Appendix A.2","sec":"10 User-Facing Content"},"FR-TXT-011":{"m":"1","t":"The instructional flow shall instruct the user to place the Test Board on a flat, stable surface before connecting the Mixing Cartridge, and to avoid applying pressure to the board surface at any point.","src":"RA 7.30; Glossary","note":"","sec":"10 User-Facing Content"},"FR-TXT-012":{"m":"1","t":"The instructional flow shall provide a visual guide for aligning the Mixing Cartridge to the Test Board in the correct orientation.","src":"RA 7.27","note":"","sec":"10 User-Facing Content"},"FR-TXT-013":{"m":"1","t":"The instructional flow shall guide the user through connecting the Mixing Cartridge to the Test Board, including the required hand position and applied force, so that the Plunger and Spring assembly is engaged and fluid transfer is initiated.","src":"RA 7.28; Glossary","note":"","sec":"10 User-Facing Content"},"FR-TXT-014":{"m":"1","t":"The instructional flow shall guide the user through the required mixing or shaking action of the Mixing Cartridge and Test Board, including its duration.","src":"RA 7.10","note":"","sec":"10 User-Facing Content"},"FR-TXT-015":{"m":"1","t":"The instructional flow shall specify the motion and depth required to operate the coloured release button, and shall state the tactile or audible cue that confirms it has been operated.","src":"RA 7.29; Glossary","note":"Approved user-facing name for the Transfer Valve. See the terminology appendix","sec":"10 User-Facing Content"},"FR-TXT-016":{"m":"1","t":"The instructional flow shall direct the user to position themselves relative to the Test Board and the light source so that neither their hand, their body, nor any object casts a shadow over the Test Board during scanning.","src":"RA 7.15","note":"Complements the detection control in FR-IMG-009","sec":"10 User-Facing Content"},"FR-TXT-017":{"m":"1","t":"The instructional flow shall provide disposal instructions for all used kit components and shall instruct the user to wash their hands after handling them.","src":"RA 7.30, 7.32","note":"The disposal content is specific to the QACR kit and does not carry over from the predecessor product, whose components differ","sec":"10 User-Facing Content"},"FR-TXT-019":{"m":"1","t":"The results screen shall instruct the user not to make medical decisions on the basis of the result without consulting a healthcare professional, shall present explanatory material describing what the measurement represents and what the result category means, and shall state that the result is shared with a healthcare professional for further analysis and care.","src":"RA 7.17","note":"Content is fixed and released under the versioned content set required by FR-TXT-004. Unlinked from resultPortalMoreInfoUrl and resultsType at review","sec":"10 User-Facing Content"},"FR-TXT-020":{"m":"1","t":"Each message presented when the software blocks an action shall name the condition detected, state the corrective action required, and provide support contact information, without disclosing personal or sensitive information.","src":"RA 4.15, 4.16; SRS ATT.6","note":"Governs the content of every blocking message in this document","sec":"10 User-Facing Content"},"FR-TXT-021":{"m":"3","t":"The invalid-test messaging shall state the reason category returned for the test and the corrective action required, and shall instruct the user to repeat the test with a new kit.","src":"RA 4.3, 4.4","note":"Depends on FR-ALG-012","sec":"10 User-Facing Content"},"FR-TXT-022":{"m":"3","t":"The software shall scale user-facing text with the text size selected in the device system settings, up to a defined maximum beyond which further increase is not applied. Within that range no text shall be truncated, overlapped or placed beyond reach.","src":"SPEC-04 review; accessibility","note":"Added at Guy's direction. The predecessor scales text from the system setting and caps it above a threshold, and the cap is the part that matters: without it a layout breaks at the largest settings. The maximum is a value to be set, like the other TBD values. Complements FR-TXT-001, which governs whether text can be understood; this governs whether it can be read","sec":"10 User-Facing Content"},"FR-TXT-023":{"m":"4","t":"The software shall support the platform screen reader on user-facing content that the software does not itself read aloud, shall not have the screen reader duplicate content the software speaks, and shall not permit screen-reader operation to alter the conduct of a test or the timing of any stage.","src":"SPEC-04 review; accessibility","note":"Added at Guy's direction, with his two constraints written in rather than left to interpretation: the instructional flow is already spoken, so the screen reader applies where it is not, and it may not interfere with the test. Conformance to WCAG AA more broadly is Q-107 and is deliberately not claimed here","sec":"10 User-Facing Content"},"FR-STA-002":{"m":"1","t":"If the test flow is interrupted by a transient event such as an incoming call, message, notification or screen lock, the software shall remain active in the background without terminating. While the application is not in the foreground the software shall not deliver instructional flow content, and on return shall resume delivery from the point the user had reached.","src":"SRS TSM.21; RA 4.1","note":"","sec":"11 Test State Retention, Interruption and Cancellation"},"FR-STA-003":{"m":"1","t":"The software shall persistently retain the current test state throughout the test flow, including the completed steps and all recorded stage start times. If the user navigates away from the application without terminating it, the software shall permit the test flow to be resumed on return at the step that was active, shall make the applicable instructions and demonstration available for replay, and shall not apply any inactivity timeout while a test is active. A test becomes active when the user activates the control that starts it. Where no test is active, the software shall return the user to the start-up state after the applicable period of inactivity, discarding any instructional flow not yet begun.","src":"SRS TSM.22; RA 4.1, 4.2, 4.3, 4.4, 4.18","note":"Covers what was previously stated separately in FR-STA-001 and FR-STA-004","sec":"11 Test State Retention, Interruption and Cancellation"},"FR-STA-005":{"m":"1","t":"If the software is interrupted during data upload, the software shall continue the upload in the background.","src":"SRS TSM.23","note":"","sec":"11 Test State Retention, Interruption and Cancellation"},"FR-STA-006":{"m":"1","t":"The software shall not permit an active test to be resumed after the application has been terminated, whether by the user, by an operating-system action, by a software crash, or by a device restart.","src":"RA 7.19","note":"","sec":"11 Test State Retention, Interruption and Cancellation"},"FR-STA-007":{"m":"1","t":"When the application is reopened following termination during an active test, the software shall identify the incomplete test, invalidate it, and inform the user that a new test must be performed using a new kit. A test whose capture completed and which awaits only transmission is not an incomplete test for this purpose.","src":"RA 7.19","note":"","sec":"11 Test State Retention, Interruption and Cancellation"},"FR-STA-008":{"m":"3","t":"The software shall permit test cancellation only while the Urine Collection Cup has not been filled. Upon cancellation being requested after that step, the software shall warn the user that the current test cannot be resumed and that a new kit will be required, and shall require explicit confirmation.","src":"SRS TSM.19; RA 7.18","note":"Consistent with RA 7.3: once urine reaches the Capillary Tube it fills completely, so the sample is committed at cup fill","sec":"11 Test State Retention, Interruption and Cancellation"},"FR-STA-009":{"m":"3","t":"If the user does not confirm cancellation, the software shall return to the active test flow at the step that was in progress.","src":"RA 7.18","note":"","sec":"11 Test State Retention, Interruption and Cancellation"},"FR-STA-010":{"m":"3","t":"If cancellation is confirmed, the software shall invalidate the active test, prevent it from being resumed, and return the user to the start-up state.","src":"SRS TSM.19; RA 7.18","note":"","sec":"11 Test State Retention, Interruption and Cancellation"},"FR-STA-012":{"m":"1","t":"The software shall prevent the device from dimming or locking the screen while the instructional flow is displayed.","src":"SPEC-04 review","note":"Prevention rather than tolerance: FR-STA-002 covers surviving a lock the user causes, and nothing previously required the device to be kept awake. A screen that darkens in the middle of a timed stage is the interruption most likely to occur, and holding it awake is also part of what the battery threshold of FR-RDY-007 is measured against","sec":"11 Test State Retention, Interruption and Cancellation"},"FR-TIM-001":{"m":"1","t":"For each time-dependent stage of the test flow, the software shall implement a defined start event, minimum duration, permitted completion window and expiry behaviour. These values shall be fixed in the application and shall not be configurable at run time.","src":"RA 4.18","note":"Values TBD, to be established by the timing-flex study. Confirmed at review that the study completes before milestone 3 and is not needed for milestones 1 and 2, so the milestone-1 build enforces these windows against provisional values","sec":"12 Timing Control"},"FR-TIM-002":{"m":"1","t":"The software shall record and persistently retain the start time of each time-dependent stage.","src":"RA 4.3, 4.4, 4.18","note":"","sec":"12 Timing Control"},"FR-TIM-003":{"m":"1","t":"Following application backgrounding, screen locking, or any other temporary interruption, the software shall calculate elapsed time from the retained start time and shall not restart the applicable timer.","src":"RA 4.3, 4.4, 4.18","note":"","sec":"12 Timing Control"},"FR-TIM-005":{"m":"1","t":"The software shall display, for each active time-dependent stage, the time remaining until the next action is permitted.","src":"RA 4.3, 4.4, 7.9","note":"Amended at the SPEC-05 review. The completion window is deliberately not displayed: showing a second clock counting against the user hurries them through the action the window exists to protect. The window is enforced silently and its length is a timing-flex value","sec":"12 Timing Control"},"FR-TIM-006":{"m":"3","t":"The software shall measure the time elapsed from the user's confirmation of sample collection to the connection of the Sample Pod to the Mixing Cartridge. If the elapsed time exceeds the defined limit, the software shall invalidate the test.","src":"SRS TSM.6, TSM.7","note":"Limit TBD, fixed not configurable; currently specified as 30 minutes. An exceeded limit invalidates the test rather than blocking the step: confirmed at review, and FR-TIM-012 carries what the user is told and that a new kit is needed. Timed silently in the background: no countdown is shown, so that the user is not hurried","sec":"12 Timing Control"},"FR-TIM-007":{"m":"1","t":"The software shall present the coloured release button instruction only after the required Incubation Well residence time has elapsed and no instruction preceding it remains outstanding.","src":"RA 4.3, 7.9","note":"Narrowed at the SPEC-05 review. An instruction the flow never presented is not outstanding: content that gives way to the clock is dropped whole and ahead of the user, so it is neither completed nor pending","sec":"12 Timing Control"},"FR-TIM-008":{"m":"1","t":"The software shall prevent progression past any time-dependent stage before the applicable minimum time has elapsed, including preventing the Test Board from being scanned before the required colour-evolution period has elapsed. This shall not apply where the application is in demonstration mode, which produces no result for a patient.","src":"RA 4.18, 4.4","note":"Also covers FR-TIM-010","sec":"12 Timing Control"},"FR-TIM-009":{"m":"2","t":"If the coloured release button step is not completed within the permitted timing window, the software shall invalidate the test and prevent continuation.","src":"RA 4.3","note":"Moved to milestone 2 at the SPEC-05 review. The demonstration does not void a test on timing grounds, so invalidation arrives with FR-TIM-012, which tells the user why. Milestone 1 previously invalidated with no requirement to explain it","sec":"12 Timing Control"},"FR-TIM-011":{"m":"2","t":"The software shall permit the Test Board to be scanned only within the validated scanning-time window, and shall invalidate the test if that window has expired.","src":"RA 4.4","note":"Moved to milestone 2 at the SPEC-05 review. The demonstration does not void a test on timing grounds, so invalidation arrives with FR-TIM-012, which tells the user why. Milestone 1 previously invalidated with no requirement to explain it","sec":"12 Timing Control"},"FR-TIM-012":{"m":"2","t":"When a test is invalidated on timing grounds, the software shall inform the user of the reason and instruct the user to repeat the test with a new kit.","src":"RA 4.3, 4.4","note":"","sec":"12 Timing Control"},"FR-TIM-014":{"m":"4","t":"The software shall issue a local device notification at the timing events of a stage that require the user's attention, and shall do so only where the application is in the background at that time.","src":"Review comment; supports RA 4.3, 4.4","note":"Local notification, not a backend push; see FR-COM-009. Widened at the SPEC-05 review from the about-to-expire warning alone. Which timing events warrant a notification, and how many there are, is the specification's business and not this requirement's — the rule is that the user is reached while the application is in the background","sec":"12 Timing Control"},"FR-TIM-015":{"m":"3","t":"The software shall emit the audible signal that marks the end of a timed stage even where the application is not in the foreground.","src":"SPEC-05 review","note":"Added at the SPEC-05 review. The signal alone, not the spoken flow and not the flow advancing: a user who set the phone down during a wait of minutes has to know the stage ended, and nothing else about the application continues while it is away. The platforms grant this differently and it may need a capability declared at release","sec":"12 Timing Control"},"FR-TIM-004":{"m":"5","t":"The software shall derive elapsed time from a time source that is not affected by user modification of the device clock or time zone.","src":"RA 4.18; formerly BL-24, restored to its original identifier","note":"Future development, formerly BL-24. Until implemented, the timing windows in section 12 can be defeated by changing the device clock, since elapsed time is derived from a source the user can alter. RA 4.18 relies on the timers being enforceable.","sec":"12 Timing Control"},"FR-IMG-001":{"m":"1","t":"The software shall validate every captured frame against the predefined IVTS acceptance thresholds, and shall permit a result to be produced only where the acquired information meets those thresholds.","src":"RA 4.8, 4.10, 4.11, 4.12","note":"Thresholds and the minimum number of valid frames are defined in the IVTS specification and fixed in the application. Unlinked from minValidFrames at review","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-002":{"m":"1","t":"The software shall capture the Test Board only where the Color Print reference markers are detected and visible within acceptance criteria and the Test Board is entirely within the camera frame, and shall block the scan where either condition is not met.","src":"SRS TSM.8, TSM.9, TSM.10; RA 3.11","note":"Also covers FR-IMG-003","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-004":{"m":"1","t":"The software shall detect whether the smartphone is too far from the Test Board. If so, the software shall prevent the user from initiating a scan and display an explanatory error message.","src":"SRS TSM.11; RA 7.12","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-005":{"m":"1","t":"The software shall detect whether the smartphone is too close to the Test Board. If so, the software shall prevent the user from initiating a scan and display an explanatory error message.","src":"SRS TSM.12; RA 7.12","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-006":{"m":"1","t":"The software shall detect whether the smartphone is positioned at an acute angle relative to the Test Board. If so, the software shall prevent the user from initiating a scan and display an explanatory error message.","src":"SRS TSM.13; RA 7.14","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-007":{"m":"1","t":"The software shall detect whether the image is too dark. If so, the software shall prevent the user from initiating a scan and display an explanatory error message.","src":"SRS TSM.14; RA 7.11","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-008":{"m":"1","t":"The software shall detect whether the image is saturated. If so, the software shall prevent the user from initiating a scan and display an explanatory error message.","src":"SRS TSM.15; RA 7.11","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-009":{"m":"1","t":"The software shall use the Color Print reference anchors to detect shadow conditions across the Test Board, and shall block the scan where shadow conditions fall outside the validated thresholds.","src":"RA 7.15","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-010":{"m":"1","t":"The software shall validate focus and motion in real time during framing, and shall capture an image only where image-quality thresholds are met.","src":"RA 7.16","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-011":{"m":"1","t":"Upon capture of the Test Board image, the software shall validate image clarity. If the image is too blurry, the software shall display an explanatory message and instruct the user to try again.","src":"SRS TSM.25; RA 7.16","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-013":{"m":"1","t":"The software shall provide real-time guidance during scanning that directs the user towards a valid distance, angle and framing position.","src":"RA 7.12, 7.14","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-014":{"m":"1","t":"Each QCR condition and each IVTS boundary condition shall produce a distinct user message that names the condition detected and states the corrective action required.","src":"RA 7.11–7.16","note":"Content per FR-TXT-020","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-015":{"m":"1","t":"Where IVTS validity thresholds are not met, the software shall invalidate the captured image and permit the user to re-scan. If the permitted scanning window expires without a sufficient number of valid frames, the software shall invalidate the test rather than produce a result of reduced reliability.","src":"RA 4.8, 4.10, 4.12","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-016":{"m":"1","t":"The software shall use the standardised reference colour spectrum of the Color Print to normalise the captured image before colorimetric values are derived from the Detection Wells.","src":"Glossary; RA 4.8","note":"Whether a raw or raw-equivalent representation is used, and whether normalisation happens on the device or in the backend, is undecided. It will not be the mechanism the earlier localLearnedRawEnabled flag implemented. See review register Q-24","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-022":{"m":"1","t":"During a timed waiting period of the test flow the software shall present a practice scan as a step of the instructional flow, which the user passes through in order to continue. A practice scan shall behave as a scan of the Test Board does, including the QCR stage, the IVTS boundary detection, the QR-code validation and the guidance, shall not apply the scanning-window limit, shall end on a limit of its own rather than on the end of the waiting period in which it began, shall not register the kit identifier as used, and shall neither produce a result nor contribute any image to the test record.","src":"Review comment; supports RA 7.11 to 7.16","note":"It exists so that a user meets the scanning interaction, and any difficulty with it, while there is still time to resolve it rather than inside the scanning window. Offered during the first timed stage, where the waiting period is longest. The kit checks run read-only here, so a user who practises on the kit they are about to test with cannot spend it. Validation against the identifier template, FR-KIT-003, arrives at milestone 3. The used-kit check, FR-KIT-004, arrives at milestone 3 as well. Until then a practice scan exercises framing and guidance only","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-023":{"m":"1","t":"After a complete frame set has been captured the software shall indicate that the images are being prepared and evaluated, and shall then either continue the flow or report a boundary condition and offer the user the opportunity to scan again.","src":"Review comment","note":"Added at review. The preparation and evaluation stage takes long enough to need a state of its own; without it the user is left on a viewfinder with nothing happening","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-024":{"m":"1","t":"During capture the software shall deliver the scan guidance in spoken form as it changes, so that a user whose attention is on the Test Board rather than on the screen is guided without having to look.","src":"Review comment; supports RA 7.12, 7.14, 7.16","note":"","sec":"13 Image Capture and Validation (IVTS)"},"FR-IMG-021":{"m":"1","t":"The software shall detect specular reflection on the Test Board surface, and shall block the scan where it falls outside the validated thresholds.","src":"Review comment; supports RA 7.11, 7.15","note":"Added at review as a further IVTS boundary condition alongside the six in this section. The Risk Analysis trace is to be confirmed when the analysis is next revised: specular reflection is a lighting condition, so RA 7.11 and RA 7.15 are the candidates. Message content per FR-IMG-014","sec":"13 Image Capture and Validation (IVTS)"},"FR-CAM-001":{"m":"1","t":"The software shall acquire, for each scan, the frame set defined by the IVTS specification, including the number of frames, the torch state applied to each, and any platform-specific additional frames, and shall transmit the complete set for analysis.","src":"SRS PER.2, PER.3; Glossary — Smartphone Application","note":"Also covers FR-IMG-017. The frame set is defined by the IVTS specification and fixed in the application. Unlinked from featureFlags.selectBestCameraEnabled at review","sec":"14 Camera Control and Image Acquisition"},"FR-CAM-002":{"m":"TBD","t":"The software shall apply the camera adjustments defined by the IVTS specification in response to a raised boundary condition, including white-balance adjustment on devices that support it and exposure adjustment where the image is too dark or too bright.","src":"SRS PER.4, PER.5","note":"Priority TBD. Realised by featureFlags.manualWhiteBalanceEnabled, manualExposureEnabled, customToneMappingEnabled","sec":"14 Camera Control and Image Acquisition"},"FR-CAM-003":{"m":"1","t":"The software shall record, with each captured image, the camera parameter set that was applied, including torch state, exposure, white balance and any tone-mapping configuration.","src":"RA 4.8","note":"Required for IVTS traceability","sec":"14 Camera Control and Image Acquisition"},"FR-CAM-004":{"m":"3","t":"If the camera becomes unavailable or returns an invalid frame during capture, the software shall abort the capture, inform the user, and permit the scan to be re-attempted within the permitted scanning window.","src":"RA 4.10","note":"","sec":"14 Camera Control and Image Acquisition"},"FR-COM-001":{"m":"3","t":"The software shall interface with the backend via HTTPS over TCP/IP using TLS 1.2 or above, with strong cipher suites, SSL chain verification and strong session identifiers. The software shall refuse to establish a connection negotiated below TLS 1.2.","src":"SRS EX.1; RA 5.1; SPTA 1.1, 2.11, 4.4, 4.5","note":"TLS floor and cipher requirements added from the threat analysis","sec":"15 Data Transmission and Backend Communication"},"FR-COM-002":{"m":"3","t":"The software shall enforce certificate pinning, so that connections are established only with servers presenting the expected SSL/TLS certificate, and shall reject a connection presenting any other certificate.","src":"SRS ATT.1; SPTA 4.4, 4.12","note":"SPTA 4.12 is the highest-scoring threat mitigated by the application alone, at 16 gross","sec":"15 Data Transmission and Backend Communication"},"FR-COM-003":{"m":"1","t":"Upon successful Test Board capture, the software shall transmit the acquired test data to the backend and shall display an indication confirming the upload status.","src":"SRS TSM.17, TSM.26","note":"","sec":"15 Data Transmission and Backend Communication"},"FR-COM-004":{"m":"1","t":"The software shall include an integrity check with each transmitted payload so that incomplete or corrupted transmission is detectable by the backend.","src":"RA 5.1","note":"","sec":"15 Data Transmission and Backend Communication"},"FR-COM-005":{"m":"1","t":"The backend shall validate received test data and shall reject transmissions that are incomplete, malformed or nonconforming to the defined data format, treating all data received from the application as untrusted.","src":"RA 5.1; SPTA 2.4","note":"Backend. SPTA 2.4 relies on this as the compensating control for a modified or instrumented application","sec":"15 Data Transmission and Backend Communication"},"FR-COM-006":{"m":"3","t":"If communication is lost during data upload, the software shall notify the user, retain the test data, initiate an automatic retry, and resume transmission once connectivity is restored.","src":"SRS TSM.18; RA 5.2, 5.3; SPTA 5.2, 5.3","note":"","sec":"15 Data Transmission and Backend Communication"},"FR-COM-007":{"m":"3","t":"Upon successful data upload and backend acknowledgement, the software shall permit the user to conclude the test process and shall delete all related test data from the smartphone.","src":"SRS TSM.24, TSM.27","note":"","sec":"15 Data Transmission and Backend Communication"},"FR-COM-008":{"m":"1","t":"If the backend returns an error, the software shall display an explanatory error message and provide instructions on the next steps available to the user.","src":"SRS TSM.29","note":"Content per FR-TXT-020","sec":"15 Data Transmission and Backend Communication"},"FR-COM-009":{"m":"4","t":"The software shall generate local device notifications without dependence on backend connectivity, for the purposes defined in FR-TIM-014.","src":"Review comment","note":"Backend push notifications are future development as FR-COM-013","sec":"15 Data Transmission and Backend Communication"},"FR-COM-012":{"m":"4","t":"The software shall request the permission required to present device notifications, shall precede the platform permission prompt with an explanation of why notifications are wanted, and shall not prevent a test from being started, completed or reported if permission is refused.","src":"Review comment; supports FR-TIM-014","note":"Added at review. FR-TIM-014 and FR-COM-009 cannot function without this permission and nothing previously required it to be asked for. Milestone follows those two requirements","sec":"15 Data Transmission and Backend Communication"},"FR-COM-010":{"m":"3","t":"The backend shall verify the identity and authorisation carried by every incoming request, and shall reject any request that is unauthenticated, unauthorised for the resource addressed, or attempting to act on a patient record other than the one associated with the verified user.","src":"SPTA 6.1; RA 6.4","note":"Backend. New from the threat analysis. The application obligation is FR-AUT-013","sec":"15 Data Transmission and Backend Communication"},"FR-COM-011":{"m":"1","t":"The software shall request the result for a completed test from the backend, shall present a waiting state until a result or an invalid-test outcome is received, and shall inform the user how the result will reach them if none is received within the defined period.","src":"Review decision CR-17; supports SRS TSM.28","note":"Added at review. FR-RES-001 presumed receipt: no requirement covered the application-side act of requesting a result. The waiting period is a system parameter and is not yet valued; see the review register","sec":"15 Data Transmission and Backend Communication"},"FR-COM-013":{"m":"5","t":"The software shall support the receipt of push notifications from the backend system.","src":"SRS OTH.1; formerly BL-05","note":"Future development, formerly BL-05. Distinct from the local notifications in FR-TIM-014 and FR-COM-009, which are in this version.",
