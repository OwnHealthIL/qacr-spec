# Repository pins
#
# The commit each code repository stood at when the evidence in this folder was
# read. A `file:line` citation only means something against a known commit —
# without this, a citation that stops resolving is indistinguishable from a
# citation that was always wrong.
#
# Re-read with:
#   for r in iosDip AndroidDip AndroidQacr urine.com.ios-qacr-app; do
#     git -C ~/Documents/Healthy.io/$r rev-parse HEAD; done
#
# If a commit below is no longer HEAD, the rows read at it may have rotted and
# are the short list worth re-verifying — not the whole table.

read_on: 2026-08-13
root: ~/Documents/Healthy.io

repositories:
